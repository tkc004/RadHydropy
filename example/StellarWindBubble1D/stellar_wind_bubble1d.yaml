par:
  simulation:
    name: stellar_wind_bubble1d
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.1, unit: Myr}
  mesh:
    ghost_cells: 100
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.1
    order: 1
    dual_energy: true
  boundary:
    condition: OutflowSph
    outflow_velocity: {value: 1000.0, unit: km/s}
    outflow_density: {value: 1.0e-22, unit: g/cm**3}
    outflow_temperature: {value: 0.0, unit: K}
    outflow_mu: 0.62
  timestep:
    dtmin: {value: 1.0e-10, unit: Myr}
    dtmax: {value: 1.0e-3, unit: Myr}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    time_list_filename: stellar_wind_bubble1d_with_metal_output_times.txt
  diagnostics:
    verbose: 0
  thermochemistry:
    network: cie_cooling
    cie_cooling: true
    cooling_safety_factor: 0.1
    cooling_temperature_floor: {value: 100.0, unit: K}
  chemistry:
    hydrogen_mass_fraction: 0.70
    metallicity: 1.0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 1024
  coordinate_system: spherical
  box_size: {value: 25.0, unit: pc}
  injection_radius: {value: 0.05, unit: pc}
  current_time: {value: 0.0, unit: Myr}
  temperature: {value: 100.0, unit: K}
  mean_molecular_weight: 0.62
  velocity: {value: 0.0, unit: km/s}
  initial_density: {value: 1.0e-24, unit: g/cm**3}
example:
  figure_prefix: StellarWindBubble1D_with_metal
  shell_edge_density_threshold_factor: 1.0
