par:
  simulation:
    name: RadiationPressureDrivenShell1D_ThinShellODE
    initial_condition_filename: InitialCondition_ThinShellODE.hdf5
    coordinate_system: cartesian
    final_time: {value: 2.0e4, unit: yr}
  mesh:
    grid_cells: 1
    ghost_cells: 2
    area: {value: 1.0, unit: pc**2}
  boundary: {condition: Periodic}
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
  timestep:
    dtmin: {value: 1.0e-4, unit: yr}
    dtmax: {value: 10.0, unit: yr}
  output:
    directory: .
    savedir: .
    filename_prefix: Output_ThinShellODE
    cadence: {value: 2.0e3, unit: yr}
  radiation:
    radiation_pressure: true
    radiation_pressure_efficiency: 1.0
    radiation_pressure_source_luminosity: {value: 1.0e38, unit: erg/s}
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size: {value: 1.0, unit: pc}
  initial_radius: {value: 0.2, unit: pc}
  shell_mass: {value: 1.482077e32, unit: g}
  temperature: {value: 1.0, unit: K}
