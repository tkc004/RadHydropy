par:
  dark_matter:
    softening: 10.0
  simulation:
    name: CosmologicalDarkMatterCorrelationZ100
    initial_condition_filename: outputs_correlation/InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 14.4, unit: kpc/(km/s)}
  mesh:
    ghost_cells: 2
    grid_cells: 128
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.25
  boundary:
    condition: Reflecting
  timestep:
    dtmin: 1.0e-12
    dtmax: {value: 1.0, unit: kpc/(km/s)}
  output:
    directory: outputs_correlation
    filename_prefix: Output
  units:
    CodeUnits:
      name: cosmological_dark_matter_correlation_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.98847e43
        UnitLength_in_cgs: 3.085677581e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 14.4
    cosmology_a_ref: 1.0
initial_condition:
  radius_inner_comoving: {value: 5.0, unit: kpc}
  radius_outer_comoving: {value: 4000.0, unit: kpc}
  time_cosmic: {value: 0.01418666885, unit: kpc/(km/s)}
  radius_perturbation_comoving: {value: 250.0, unit: kpc}
  target_halo_mass: 100.0
  initial_overdensity: 0.0166930693
  rho_proper_profile: linear_correlation
  correlation_h: 0.674
  baryon_fraction: 0.157
  hydrogen_mass_fraction: 0.76
  mu: 0.59
  dark_matter_shells: 256
  radius_inner_dark_matter_comoving: {value: 0.1, unit: kpc}
  softening: 10.0
  specific_angular_momentum: 1500.0
  dm_specific_angular_momentum: 0.01
  uv_background_on_redshift: 10.0
  cie_temperature_proper: 10.0
example:
  snapshot_count: 7
  dark_matter_crossing_safety_factor: 0.5
  dm_only_shells: 1024
  dm_density_bins: 128
  dm_only_density_times: [0.0141867, 4.0, 8.0, 10.0, 12.0, 14.0, 16.0]
  dm_only_calibration_timestep: 0.0005
  dm_only_supercomoving_timestep: 0.01
  linear_correlation_table_filename: outputs_correlation/lcdm_linear_correlation.h5
