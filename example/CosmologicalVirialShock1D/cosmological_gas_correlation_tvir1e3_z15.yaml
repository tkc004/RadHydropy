runparams:
  simname: CosmologicalGasCorrelationTvir1e3Z15
  figure_prefix: CosmologicalGasCorrelationTvir1e3Z15
  ICfilename: outputs_correlation_gas_tvir1e3_z15_gas1024/InitialCondition.hdf5
  outdir: outputs_correlation_gas_tvir1e3_z15_gas1024
  savedir: outputs_correlation_gas_tvir1e3_z15_gas1024
  outfileprefix: Output
  coordsys: spherical
  EOStype: polytropic
  gamma: 1.6666666666666667
  selfgravity: true
  cosmological_expansion: true
  supercomoving_coordinates: true
  cosmological_gravity: true
  cosmology_type: einstein_de_sitter
  cosmology_t_ref: 14.4
  cosmology_a_ref: 1.0
  boundcond: InflowSph
  cosmological_background_boundary_reconstruction: true
  noghost: 2
  order: 1
  dual_energy: true
  gas_angular_momentum: false
  dual_energy_eta1: 1.0e-3
  dual_energy_eta2: 1.0e-1
  dual_energy_consistency_factor: 1.0e-1
  dual_energy_pressure_selection: switch
  dual_energy_entropy_limiter: true
  dual_energy_pressure_floor: 1.0e-20
  riemann_solver: Rusanov
  CFL: 0.10
  dark_matter_crossing_safety_factor: 0.5
  dark_matter_crossing_batch_fraction: 0.1
  dark_matter_global_timestep_limit: false
  smooth_dm_force_for_gas: true
  dm_density_bins: 128
  dtmin: {value: 1.0e-12, unit: Myr}
  cfl_density_floor: 9.3e-20
  temperature_jump_error_threshold: 1.0e8
  minimum_temperature: null
  temperature_plot_ymin: {value: 1.0, unit: K}
  dtmax: {value: 200.0, unit: Myr}
  final_cosmic_time: 0.225
  energy_diagnostics: true
  plot_exclude_outer_cells: 2
  gas_profile_cadence: 0.05
  # EdS transfer shape with modes larger than this 1 Mpc comoving domain
  # removed (k_min = 2 pi / L_box).  This matches the evolution cosmology
  # and the finite radial box used by this test.
  linear_correlation_table_filename: outputs_correlation/eds_finite_box_1Mpc_linear_correlation.h5
  thermochemistry_network: hydrogen
  hydrogen_chemistry: false
  hydrogen_atomic_cooling: false
  hydrogen_recombination: false
  hydrogen_collisional_ionization: false
  hydrogen_thermal_coupling: false
  cie_cooling: false
  metal_pie_enabled: false
  compton_cmb_enabled: false
  cmb_temperature_0: {value: 2.7255, unit: K}
  hydrogen_mass_fraction: 0.76
  CodeUnits:
    name: cosmological_gas_correlation_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.98847e43
      UnitLength_in_cgs: 3.085677581e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 1024
  rmin: 3.0
  rmax: 4000.0
  verbal: 1
  initial_cosmic_time: 0.01418666885
  perturbation_radius: 250.0
  # Code mass units are 1e10 Msun.  A 1e-4 target therefore corresponds to
  # 1e6 Msun, appropriate for Tvir~1e3 K at z=15.  Keeping this mass scale
  # below the finite 1 Mpc box is essential for the correlation profile.
  target_halo_mass: 1.0e-4
  # Calibrate the linear perturbation to collapse at z=20, leaving the
  # simulation time from z=20 to z=15 for shell crossing and virialization.
  # EdS: delta_i = delta_c D_i/D_coll = 1.686*(21/101) = 0.3503168.
  initial_overdensity: 0.3503168317
  initial_density_profile: linear_correlation
  correlation_h: 0.674
  baryon_fraction: 0.157
  hydrogen_mass_fraction: 0.76
  mu: 0.59
  dark_matter_shells: 2048
  dm_inner_radius: 0.01
  dm_core_absorption_velocity: 0.0
  dm_core_absorption_energy: 0.0
  specific_angular_momentum: 1500.0
  dm_specific_angular_momentum: 0.02
  softening: 0.2
  cmb_equilibrium_initial: true
  cmb_temperature_0: 2.7255
  cmb_residual_electron_fraction: 2.0e-4
