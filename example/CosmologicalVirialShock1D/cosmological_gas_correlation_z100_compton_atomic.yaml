par:
  dark_matter:
    softening: 0.2
  simulation:
    name: CosmologicalGasCorrelationZ100ComptonAtomic
    initial_condition_filename: outputs_correlation_gas_compton_atomic/InitialCondition.hdf5
    coordinate_system: spherical
    final_time: 1.0
  mesh:
    ghost_cells: 2
    grid_cells: 256
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.1
    order: 1
    dual_energy: true
    dual_energy_eta1: 0.001
    dual_energy_eta2: 0.1
    dual_energy_pressure_floor: 1.0e-20
    smooth_dm_force_for_gas: true
    cfl_density_floor: 9.3e-20
    temperature_jump_error_threshold: 1.0e8
    energy_diagnostics: true
  boundary:
    condition: InflowSph
  timestep:
    dtmin:
      value: 1.0e-12
      unit: Myr
    dtmax:
      value: 200.0
      unit: Myr
  dark_matter_crossing_safety_factor: 0.5
  output:
    directory: outputs_correlation_gas_compton_atomic
    savedir: outputs_correlation_gas_compton_atomic
    filename_prefix: Output
  units:
    CodeUnits:
      name: cosmological_gas_correlation_compton_atomic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.98847e43
        UnitLength_in_cgs: 3.085677581e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 14.4
    cosmology_a_ref: 1.0
  thermochemistry:
    hydrogen_source_solver: split_implicit
    hydrogen_implicit_absolute_temperature_tolerance:
      value: 0.1
      unit: K
    hydrogen_implicit_tolerance: 0.0001
    hydrogen_update_mu: true
    hydrogen_collisional_ionization: true
    hydrogen_xHI_initial: 0.9998
    compton_cmb_enabled: true
    hydrogen_implicit_max_refinements: 24
    cmb_temperature_0:
      value: 2.7255
      unit: K
    hydrogen_source_density_floor:
      value: 1.0e-26
      unit: g/cm**3
    hydrogen_source_skip_floor_cells: true
    hydrogen_hybrid_change_tolerance: 0.1
    hydrogen_recombination: true
    metal_pie_enabled: false
    hydrogen_mass_fraction: 0.76
    compton_cmb_redshift: 100.0
    thermochemistry_network: hydrogen
    compton_only: false
    cie_cooling: false
    hydrogen_implicit_fallback: error
    hydrogen_implicit_debug: false
    hydrogen_atomic_cooling: true
    hydrogen_thermal_coupling: true
    hydrogen_chemistry: true
    hydrogen_source_floor_temperature_tolerance: 0.01
  figure_prefix: CosmologicalGasCorrelationZ100_ComptonAtomic
  cosmological_background_boundary_reconstruction: true
  dark_matter_crossing_batch_fraction: 0.01
  dark_matter_global_timestep_limit: false
  dm_density_bins: 128
  temperature_plot_ymin:
    value: 1.0
    unit: K
  gas_profile_cadence: 0.1
  linear_correlation_table_filename: outputs_correlation/lcdm_linear_correlation.h5
  minimum_temperature:
    value: 2.69851485e-05
    unit: K
initial_condition:
  rmin: 3.0
  rmax: 4000.0
  verbal: 1
  initial_cosmic_time: 0.01418666885
  perturbation_radius: 250.0
  target_halo_mass: 100.0
  initial_overdensity: 0.0166930693
  initial_density_profile: linear_correlation
  correlation_h: 0.674
  baryon_fraction: 0.157
  hydrogen_mass_fraction: 0.76
  mu: 0.59
  dark_matter_shells: 1024
  dm_inner_radius: 0.01
  specific_angular_momentum: 1500.0
  dm_specific_angular_momentum: 0.02
  cmb_equilibrium_initial: true
  cmb_temperature_0: 2.7255
  cmb_residual_electron_fraction: 0.0002
