par:
  dark_matter:
    softening: 0.0
  simulation:
    name: CosmologicalVirialShock1D_Smoke
    initial_condition_filename: outputs_virial_shock_smoke/InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.05, unit: kpc/(km/s)}
  mesh:
    ghost_cells: 2
    grid_cells: 32
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.1
    order: 0
    dual_energy: true
    dual_energy_eta1: 0.001
    dual_energy_eta2: 0.1
    dual_energy_consistency_factor: 0.1
    dual_energy_pressure_floor: 1.0e-20
    smooth_dm_force_for_gas: true
    cfl_density_floor: 0.0
    temperature_jump_error_threshold: 1.0e10
  boundary:
    condition: OpenSph
  timestep:
    dtmin: 1.0e-12
    dtmax: {value: 0.01, unit: kpc/(km/s)}
  output:
    directory: outputs_virial_shock_smoke
    filename_prefix: Output
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 14.4
    cosmology_a_ref: 1.0
  units:
    CodeUnits:
      name: cosmological_virial_shock_smoke_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.98847e43
        UnitLength_in_cgs: 3.085677581e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  thermochemistry:
    metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
    metal_pie_enabled: true
    cie_cooling: false
    thermochemistry_network: pie_uvbg_cooling
    hydrogen_mass_fraction: 0.76
    hydrogen_chemistry: true
    hydrogen_collisional_ionization: true
    hydrogen_recombination: true
    hydrogen_update_mu: true
    hydrogen_atomic_cooling: true
    hydrogen_thermal_coupling: true
    compton_cmb_enabled: true
    cmb_temperature_0: 2.7255
    metal_pie_redshift: 10.0
    metallicity: 0.01
initial_condition:
  radius_inner_comoving: {value: 3.0, unit: kpc}
  radius_outer_comoving: {value: 500.0, unit: kpc}
  time_cosmic: {value: 0.01418666885, unit: kpc/(km/s)}
  radius_perturbation_comoving: {value: 250.0, unit: kpc}
  target_halo_mass: 100.0
  initial_overdensity: 0.001
  rho_proper_profile: linear_correlation
  correlation_h: 0.674
  baryon_fraction: 0.157
  hydrogen_mass_fraction: 0.76
  mu: 0.59
  dark_matter_shells: 64
  radius_inner_dark_matter_comoving: {value: 0.01, unit: kpc}
  dm_specific_angular_momentum: 0.0
  specific_angular_momentum: 0.0
  cmb_equilibrium_initial: true
  cmb_temperature_0: 2.7255
  cmb_residual_electron_fraction: 0.0002
  uv_background_on_redshift: 10.0
  cie_temperature_proper: 0.0001
example:
  gas_profile_cadence: 0.01
  linear_correlation_table_filename: outputs_correlation/lcdm_linear_correlation.h5
