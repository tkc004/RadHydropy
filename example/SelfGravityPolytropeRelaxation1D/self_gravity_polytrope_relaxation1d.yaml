par:
  simulation:
    name: SelfGravityPolytropeRelaxation1D
    coordinate_system: spherical
    initial_condition_filename: InitialCondition.hdf5
    final_time: {value: 0.4, unit: Myr}
  mesh:
    grid_cells: 192
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 2.0
    CFL: 0.15
    order: 0
  gravity:
    selfgravity: true
    externalgravity: false
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e2, unit: yr}
    dtmax: {value: 2.0e4, unit: yr}
  output:
    directory: .
    filename_prefix: Output
    cadence: {value: 0.2, unit: Myr}
  units:
    CodeUnits:
      name: polytrope_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size_proper: {value: 1.0, unit: pc}
  radius_inner_proper: {value: 0.0, unit: pc}
  radius_outer_proper: {value: 1.0, unit: pc}
  time_proper: {value: 0.0, unit: s}
  rho_central_proper: {value: 1.0e-20, unit: g/cm**3}
  radius_polytropic_proper: {value: 0.318309886, unit: pc}
  vel_perturbation_dimensionless: 0.01
  mu_dimensionless: 1.0
example:
  relaxation_damping_time: {value: 0.02, unit: Myr}
