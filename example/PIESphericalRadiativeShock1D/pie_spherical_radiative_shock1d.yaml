par:
  simulation:
    name: PIESphericalRadiativeShock1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 20.0, unit: Myr}
  mesh:
    ghost_cells: 2
    grid_cells: 512
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.2
    order: 0
  boundary:
    condition: InflowSph
    vel_inflow_proper: {value: -100.0, unit: km/s}
    rho_inflow_proper: {value: 4.402e-27, unit: g/cm**3}
    temperature_inflow_proper: {value: 10000.0, unit: K}
    inflow_mu: 0.62
    vel_outflow_proper: {value: 100.0, unit: km/s}
    rho_outflow_proper: {value: 4.402e-27, unit: g/cm**3}
    temperature_outflow_proper: {value: 10000.0, unit: K}
    outflow_mu: 0.62
  timestep:
    dtmin: {value: 1.0, unit: yr}
    dtmax: {value: 0.01, unit: Myr}
  output:
    directory: outputs
    savedir: outputs
    filename_prefix: Output
    time_interval: {value: 0.5, unit: Myr}
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e10
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  thermochemistry:
    verbose: 0
    thermochemistry_network: pie_uvbg_cooling
    metal_pie_enabled: true
    metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
    metal_pie_redshift: 0.0
    metal_pie_photoheating_max_density_cgs_cm3: 50.0
    metallicity: 1.0
    hydrogen_mass_fraction: 0.76
    cooling_safety_factor: 0.05
    pie_uvbg_implicit_step_doubling: false
    cooling_temperature_floor: {value: 100.0, unit: K}
  radiation:
    radiative_transfer: false
initial_condition:
  nogrid: 512
  coordsys: spherical
  box_size_proper: {value: 19.0, unit: kpc}
  radius_inner_proper: {value: 1.0, unit: kpc}
  radius_outer_proper: {value: 20.0, unit: kpc}
  time_proper: {value: 0.0, unit: Myr}
  hydrogen_number_density: {value: 0.002, unit: cm**-3}
  vel_inflow_proper: {value: -100.0, unit: km/s}
  vel_outflow_proper: {value: 100.0, unit: km/s}
  temperature_inflow_proper: {value: 1.0e4, unit: K}
  mean_molecular_weight: 0.62
example: {}
