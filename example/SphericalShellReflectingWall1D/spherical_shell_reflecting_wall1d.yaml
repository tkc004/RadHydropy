par:
  simulation:
    name: SphericalShellReflectingWall1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 30.0, unit: Myr}
  mesh:
    ghost_cells: 10
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666667
    CFL: 0.5
    order: 0
    riemann_solver: HLLC
    dual_energy: false
    cfl_density_floor: 1.0e-30
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e-6, unit: s}
    dtmax: {value: 1.0e15, unit: s}
  output:
    directory: outputs
    savedir: outputs
    filename_prefix: Output
    cadence: {value: 5.0, unit: Myr}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: spherical_shell_wall_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 64
  coordinate_system: spherical
  inner_radius: {value: 1.0, unit: kpc}
  outer_radius: {value: 20.0, unit: kpc}
  shell_inner: {value: 8.0, unit: kpc}
  shell_outer: {value: 10.0, unit: kpc}
  shell_density: 1.0
  temperature: {value: 10.0, unit: K}
  velocity: {value: -300.0, unit: km/s}
  mean_molecular_weight: 0.59
example:
  shell_edge_density_threshold_factor: 1.0
  plot_filename: SphericalShellReflectingWall1D.jpg
