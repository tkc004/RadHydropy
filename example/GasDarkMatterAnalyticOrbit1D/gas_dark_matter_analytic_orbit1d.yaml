par:
  simulation:
    name: GasDarkMatterAnalyticOrbit1D
    final_time: {value: 0.25, unit: pc/(km/s)}
  output:
    directory: .
  units:
    CodeUnits:
      name: gas_dark_matter_analytic_orbit_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
example:
  output_interval: {value: 0.0005, unit: pc/(km/s)}
initial_condition:
  central_dark_matter_mass_dimensionless: 0.15
  uniform_gas_density_dimensionless: 0.20
  radius_initial_orbit_dimensionless: 0.55
  vel_proper: {value: 0.0, unit: km/s}
  specific_angular_momentum_dimensionless: 0.16
  softening_dimensionless: 0.02
  shell_mass_dimensionless: 1.0e-12
