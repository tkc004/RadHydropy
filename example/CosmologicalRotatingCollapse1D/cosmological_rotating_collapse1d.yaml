par:
  simulation:
    name: CosmologicalRotatingCollapse1D
    coordinate_system: spherical
    final_time: 1.25
  mesh:
    grid_cells: 64
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    order: 1
    hydro_integrator: ssprk2
    positivity_preserving: false
    angular_momentum_flux_scheme: fct
    dual_energy: true
    energy_diagnostics: true
    CFL: 0.1
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 1.0
    cosmology_a_ref: 1.0
  boundary:
    condition: Reflecting
  timestep:
    dtmin: 1.0e-8
    dtmax: 0.01
  output:
    directory: outputs
    filename_prefix: Output
  units:
    CodeUnits:
      name: cosmological_rotating_collapse_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  radius_inner_comoving: {value: 0.0, unit: pc}
  radius_outer_comoving: {value: 2.0, unit: pc}
  time_cosmic: 1.0
  radius_top_hat_comoving: {value: 0.75, unit: pc}
  overdensity: 0.20
  temperature_proper: {value: 1.0e-3, unit: K}
  mean_molecular_weight: 1.0
  moderate_rotation_factor: 0.45
  high_rotation_factor: 0.85
example: {}
