runparams:
  simname: CosmologicalRotatingCollapse1D
  output_root: outputs
  savedir: outputs
  coordsys: spherical
  selfgravity: true
  cosmological_expansion: true
  supercomoving_coordinates: true
  cosmological_gravity: true
  cosmology_type: einstein_de_sitter
  cosmology_t_ref: 1.0
  cosmology_a_ref: 1.0
  gamma: 1.6666666666666667
  EOStype: polytropic
  boundcond: Reflecting
  order: 1
  hydro_integrator: ssprk2
  source_integrator: strang
  positivity_preserving: false
  angular_momentum_flux_scheme: fct
  dual_energy: true
  energy_diagnostics: true
  CFL: 0.1
  final_cosmic_time: 1.25
  dtmin: 1.0e-8
  dtmax: 0.01
  noghost: 2
  verbose: 0
  CodeUnits:
    name: cosmological_rotating_collapse_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0e33
      UnitLength_in_cgs: 3.08567758e18
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 64
  rmin:
    value: 0.0
    unit: pc
  rmax:
    value: 2.0
    unit: pc
  cosmic_time: 1.0
  top_hat_radius:
    value: 0.75
    unit: pc
  overdensity: 0.20
  tempini:
    value: 1.0e-3
    unit: K
  muini: 1.0
  moderate_rotation_factor: 0.45
  high_rotation_factor: 0.85
