runparams:
  simname: high_mach_contact_advection1d
  ICfilename: InitialCondition_contact.hdf5
  outdir: outputs_high_mach_contact_advection1d
  savedir: outputs_high_mach_contact_advection1d
  outfileprefix: Output
  outdeltatime: {value: 0.5, unit: s}
  coordsys: cartesian
  EOStype: polytropic
  gamma: 1.6666666666666667
  timesim: {value: 10.0, unit: s}
  CFL: 0.1
  boundcond: Periodic
  noghost: 2
  verbose: 0
  order: 0
  riemann_solver: Rusanov
  dual_energy: true
  dual_energy_eta1: 1.0e-3
  dual_energy_eta2: 1.0e-1
  dual_energy_pressure_floor: 1.0e-20
  hydro_temperature_floor: null
  positivity_preserving: true
  dtmin: {value: 1.0e-12, unit: s}
  dtmax: {value: 0.05, unit: s}
  CodeUnits:
    name: high_mach_contact_advection_cgs
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0
      UnitLength_in_cgs: 1.0
      UnitVelocity_in_cgs: 1.0
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 128
  coordsys: cartesian
  boxsize: {value: 1.0e10, unit: cm}
  time: {value: 0.0, unit: s}
  rho_left: {value: 10.0, unit: g/cm**3}
  rho_right: {value: 1.0, unit: g/cm**3}
  pressureini: {value: 8.254e7, unit: erg/cm**3}
  vini: {value: 1.0e8, unit: cm/s}
  muini: 1.0
