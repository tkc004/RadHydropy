par:
  simulation:
    name: EinsteinDeSitterTopHatGrowth1D
    coordinate_system: spherical
    initial_condition_filename: InitialCondition.hdf5
    final_time: 0.20
  mesh: {grid_cells: 64, ghost_cells: 2}
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    order: 0
    CFL: 0.2
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 1.0
    cosmology_a_ref: 1.0
  boundary: {condition: Reflecting}
  timestep: {dtmin: 1.0e-8, dtmax: 0.01}
  output: {directory: ., savedir: ., filename_prefix: Output}
  units:
    CodeUnits:
      name: einstein_de_sitter_top_hat_growth_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  boxsize: {value: 2.0, unit: pc}
  rmin: {value: 0.0, unit: pc}
  rmax: {value: 2.0, unit: pc}
  cosmic_time: 1.0
  top_hat_radius: {value: 0.5, unit: pc}
  overdensity: 0.005
  tempini: {value: 1.0e-6, unit: K}
  muini: 1.0
example:
  growth_tolerance: 0.10
