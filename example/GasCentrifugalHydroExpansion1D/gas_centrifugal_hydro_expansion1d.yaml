par:
  simulation: {name: GasCentrifugalHydroExpansion1D, coordinate_system: spherical, initial_condition_filename: outputs/InitialCondition.hdf5, final_time: 0.01}
  mesh: {grid_cells: 32, ghost_cells: 2}
  hydrodynamics: {eos_type: isothermal, gamma: 1.4, order: 0, CFL: 0.05, dual_energy: true, gas_angular_momentum: true, gas_rotational_energy: true, positivity_preserving: false}
  boundary: {condition: Reflecting}
  timestep: {dtmin: 1.0e-8, dtmax: 5.0e-4}
  output: {directory: outputs, savedir: outputs, filename_prefix: Output, cadence: 0.005}
  units:
    CodeUnits:
      name: gas_centrifugal_hydro_expansion_units
      InternalUnitSystem: {UnitMass_in_cgs: 1.0, UnitLength_in_cgs: 1.0, UnitVelocity_in_cgs: 1.0e5, UnitCurrent_in_cgs: 1.0, UnitTemp_in_cgs: 1.0}
initial_condition:
  radius_min: 0.5
  radius_max: 1.5
  density: 1.0
  central_mass: 1.0
  rotation_factor: 1.2
  reference_samples_per_cell: 32
example: {temperature: 1.0e-8}
