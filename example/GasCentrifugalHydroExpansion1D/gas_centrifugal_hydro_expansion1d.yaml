par:
  simulation:
    name: GasCentrifugalHydroExpansion1D
    coordinate_system: spherical
    initial_condition_filename: outputs/InitialCondition.hdf5
    final_time: {value: 1.0e-7, unit: s}
  mesh:
    grid_cells: 32
    ghost_cells: 2
  hydrodynamics:
    eos_type: isothermal
    gamma: 1.4
    order: 0
    CFL: 0.05
    dual_energy: true
    gas_angular_momentum: true
    gas_rotational_energy: true
    positivity_preserving: false
  boundary:
    condition: Reflecting
  timestep:
    dtmin: 1.0e-8
    dtmax: {value: 5.0e-9, unit: s}
  output:
    directory: outputs
    filename_prefix: Output
    cadence: {value: 5.0e-8, unit: s}
  units:
    CodeUnits:
      name: gas_centrifugal_hydro_expansion_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  time_proper: {value: 0.0, unit: s}
  radius_inner_proper: {value: 0.5, unit: cm}
  radius_outer_proper: {value: 1.5, unit: cm}
  rho_proper: {value: 1.0, unit: g/cm**3}
  central_mass_proper: {value: 1.0, unit: g}
  rotation_factor: 1.2
  reference_samples_per_cell: 32
  temperature_proper: {value: 1.0e-8, unit: K}
example: {}
