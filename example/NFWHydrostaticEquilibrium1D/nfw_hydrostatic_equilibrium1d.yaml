runparams:
  simname: NFWHydrostaticEquilibrium1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: nfw_hydrostatic_equilibrium1d_output_times.txt
  savedir: .
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0e8
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0
  coordsys: spherical
  EOStype: isothermal
  gamma: 1.0
  timesim:
    value: 1.0e6
    unit: yr
