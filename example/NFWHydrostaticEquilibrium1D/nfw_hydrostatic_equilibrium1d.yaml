par:
  simulation:
    name: NFWHydrostaticEquilibrium1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time:
      value: 1.0e6
      unit: yr
  mesh:
    grid_cells: 256
    ghost_cells: 2
  hydrodynamics:
    eos_type: isothermal
    gamma: 1.0
    CFL: 0.2
    order: 0
  boundary:
    condition: Reflecting
  timestep:
    dtmin:
      value: 1.0e2
      unit: yr
    dtmax:
      value: 1.0e5
      unit: yr
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    time_list_filename: nfw_hydrostatic_equilibrium1d_output_times.txt
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e8
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  diagnostics:
    verbose: 0
initial_condition:
  boxsize:
    value: 10.0
    unit: kpc
  time:
    value: 0.0
    unit: yr
  rmin:
    value: 0.1
    unit: kpc
  rmax:
    value: 9.6
    unit: kpc
  halo_mass:
    value: 1.0e8
    unit: Msun
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0:
    value: 70.0
    unit: km/(s*Mpc)
  gas_fraction: 0.157
  mu: 0.59
  rho_ref:
    value: 1.0e-27
    unit: g/cm**3
  tempini:
    value: 1.0
    unit: K
example: {}
