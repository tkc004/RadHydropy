  rmax:
    value: 9.6
    unit: kpc
  halo_mass:
    value: 1.0e8
    unit: Msun
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0:
    value: 70.0
    unit: km/(s*Mpc)
  gas_fraction: 0.157
  mu: 0.59
  rho_ref:
    value: 1.0e-27
    unit: g/cm**3
  tempini:
    value: 1.0
    unit: K
