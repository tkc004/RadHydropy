par:
  simulation:
    name: ComptonCMBHeating1D
    initial_condition_filename: ComptonCMBHeating1D_InitialCondition.hdf5
    coordinate_system: cartesian
    final_time:
      value: 1.0e3
      unit: Myr
  mesh:
    grid_cells: 8
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
  chemistry:
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 0.0
    hydrogen_xHI_inflow: 0.0
    hydrogen_xHI_outflow: 0.0
    hydrogen_recombination: false
    hydrogen_collisional_ionization: false
    hydrogen_update_mu: false
    hydrogen_thermal_coupling: true
  radiation:
    hydrogen_radiation_field: false
    radiative_transfer: false
  thermochemistry:
    hydrogen_chemistry: true
    hydrogen_atomic_cooling: false
    hydrogen_source_solver: explicit
    compton_cmb_enabled: true
    compton_cmb_redshift: 100.0
    cmb_temperature_0:
      value: 2.7255
      unit: K
  output:
    directory: .
    savedir: .
    filename_prefix: ComptonCMBHeating1D_Output
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0

initial_condition:
  box_size:
    value: 1.0
    unit: kpc
  current_time:
    value: 0.0
    unit: Myr
  hydrogen_density:
    value: 1.0e-3
    unit: 1/cm**3
  initial_temperature:
    value: 1.0e6
    unit: K
  xHI: 0.99
  mean_molecular_weight: 0.9900990099

example:
  evolution_timestep:
    value: 5.0
    unit: Myr
  cases:
    cooling: 1.0e6
    heating: 1.0
