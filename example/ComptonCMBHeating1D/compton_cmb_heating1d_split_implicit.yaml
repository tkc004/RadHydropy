par:
  simulation:
    name: ComptonCMBHeating1D_split_implicit
    initial_condition_filename: ComptonCMBHeating1D_split_implicit_InitialCondition.hdf5
    coordinate_system: cartesian
    final_time: {value: 1.0, unit: Myr}
  mesh: {grid_cells: 8, ghost_cells: 2}
  hydrodynamics: {eos_type: polytropic, gamma: 1.6666666666666667}
  chemistry:
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 0.99
    hydrogen_xHI_inflow: 0.99
    hydrogen_xHI_outflow: 0.99
    hydrogen_recombination: true
    hydrogen_collisional_ionization: true
    hydrogen_update_mu: true
    hydrogen_thermal_coupling: true
  thermochemistry:
    hydrogen_chemistry: true
    hydrogen_atomic_cooling: true
    hydrogen_source_solver: split_implicit
    hydrogen_source_CFL: 0.1
    hydrogen_source_dtmin: 0.0
    hydrogen_split_implicit_max_subcycles: 100000
    hydrogen_implicit_fallback: error
    compton_cmb_enabled: true
    compton_cmb_redshift: 100.0
    cmb_temperature_0: {value: 2.7255, unit: K}
  radiation: {hydrogen_radiation_field: false, radiative_transfer: false}
  output:
    directory: .
    savedir: outputs_split_implicit
    filename_prefix: ComptonCMBHeating1D_SplitImplicit_Output
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem: {UnitMass_in_cgs: 1.0, UnitLength_in_cgs: 1.0, UnitVelocity_in_cgs: 1.0, UnitCurrent_in_cgs: 1.0, UnitTemp_in_cgs: 1.0}
initial_condition:
  box_size: {value: 1.0, unit: kpc}
  current_time: {value: 0.0, unit: Myr}
  hydrogen_density: {value: 1.0e-3, unit: 1/cm**3}
  initial_temperature: {value: 1.0e6, unit: K}
  xHI: 0.99
  mean_molecular_weight: 0.9950248756
example:
  evolution_timestep: {value: 1.0e-1, unit: Myr}
  compare_compton_analytic: false
  cases: {hot_atomic_compton: 1.0e6, cold_atomic_compton: 1.0e2}
