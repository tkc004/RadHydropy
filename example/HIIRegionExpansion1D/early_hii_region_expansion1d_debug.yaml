runparams:
  simname: EarlyHIIRegionExpansion1D_debug
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: output_times_early_debug.txt
  savedir: .
  verbose: 0
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 4.92e31
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  source_photon_rate:
    value: 1.0e49
    unit: 1/s
  area:
    value: 1.0
    unit: cm**2
  rho_initial:
    value: 5.21e-21
    unit: g/cm**3
  neutral_temperature:
    value: 1.0e2
    unit: K
  ionized_temperature:
    value: 1.0e4
    unit: K
  ionized_sound_speed:
    value: 12.85
    unit: km/s
  sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  alpha_B_coefficient:
    value: 2.7e-13
    unit: cm**3/s
  boxsize:
    value: 2.0
    unit: pc
  dtmin:
    value: 1.0e-10
    unit: Myr
  final_time:
    value: 0.001
    unit: Myr
  hydro_cfl: 0.5
  hydro_order: 1
  source_cfl: 1.0
  hydro_timestep_max:
    value: 2.0e-4
    unit: Myr
  source_timestep_min:
    value: 1.0e-12
    unit: Myr
  number_of_cells: 16
  radiative_transfer_update_interval: 100
  hydrogen_beta:
    value: 0.0
    unit: cm**3/s
  hydrogen_epsilon_gamma:
    value: 0.0
    unit: erg
  hydrogen_ngamma_initial:
    value: 0.0
    unit: 1/cm**3
  radiative_transfer_boundary_flux:
    value: 0.0
    unit: 1/(cm**2*s)
  comparison_time:
    value: 0.001
    unit: Myr
  output_snapshots:
    - time:
        value: 0.0
        unit: Myr
    - time:
        value: 0.00025
        unit: Myr
      label: 0p00025
    - time:
        value: 0.00050
        unit: Myr
    - time:
        value: 0.0010
        unit: Myr
      label: 0p001
