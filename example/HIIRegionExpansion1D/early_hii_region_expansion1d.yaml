runparams:
  simname: EarlyHIIRegionExpansion1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: output_times_early.txt
  savedir: .
  verbose: 0
  coordsys: spherical
  boundcond: OpenSph
  EOStype: isothermal
  gamma: 1.0
  area:
    value: 1.0
    unit: cm**2
  noghost: 2
  timesim:
    value: 0.14
    unit: Myr
  CFL: 0.5
  order: 1
  dtmin:
    value: 1.0e-10
    unit: Myr
  dtmax:
    value: 2.0e-4
    unit: Myr
  hydrogen_chemistry: true
  hydrogen_mass_fraction: 1.0
  hydrogen_xHI_initial: 1.0
  hydrogen_xHI_inflow: 1.0
  hydrogen_xHI_outflow: 1.0
  hydrogen_source_CFL: 10000.0
  hydrogen_source_dtmin:
    value: 1.0e-12
    unit: Myr
  hydrogen_update_mu: true
  hydrogen_thermal_coupling: false
  hydrogen_recombination: true
  hydrogen_collisional_ionization: false
  hydrogen_alpha_B:
    value: 2.7e-13
    unit: cm**3/s
  hydrogen_beta:
    value: 0.0
    unit: cm**3/s
  hydrogen_radiation_field: false
  hydrogen_radiation_evolution: false
  hydrogen_ngamma_initial:
    value: 0.0
    unit: 1/cm**3
  hydrogen_sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  hydrogen_epsilon_gamma:
    value: 0.0
    unit: erg
  radiative_transfer: true
  radiative_transfer_method: long_characteristics
  radiative_transfer_boundary_flux:
    value: 0.0
    unit: 1/(cm**2*s)
  radiative_transfer_source_photon_rate:
    value: 1.0e49
    unit: 1/s
  radiative_transfer_direction: 1
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 4.92e31
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  source_photon_rate:
    value: 1.0e49
    unit: 1/s
  rho_initial:
    value: 5.21e-21
    unit: g/cm**3
  neutral_temperature:
    value: 1.0e2
    unit: K
  ionized_temperature:
    value: 1.0e4
    unit: K
  ionized_sound_speed:
    value: 12.85
    unit: km/s
  sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  alpha_B_coefficient:
    value: 2.7e-13
    unit: cm**3/s
  boxsize:
    value: 2.0
    unit: pc
  number_of_cells: 512
  final_time:
    value: 0.14
    unit: Myr
  comparison_time:
    value: 0.14
    unit: Myr
  output_snapshots:
    - time:
        value: 0.0
        unit: Myr
    - time:
        value: 0.005
        unit: Myr
      label: 0p005
    - time:
        value: 0.010
        unit: Myr
    - time:
        value: 0.020
        unit: Myr
      label: 0p020
    - time:
        value: 0.040
        unit: Myr
    - time:
        value: 0.080
        unit: Myr
      label: 0p080
    - time:
        value: 0.120
        unit: Myr
    - time:
        value: 0.140
        unit: Myr
      label: 0p140
