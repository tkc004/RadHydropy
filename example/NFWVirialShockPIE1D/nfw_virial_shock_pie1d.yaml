runparams:
  simname: NFWVirialShockPIE1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: nfw_virial_shock_pie1d_output_times.txt
  savedir: .
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 3.0e11
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0
  coordsys: spherical
  EOStype: polytropic
  gamma: 1.6666666666666667
  timesim:
    value: 2000.0
    unit: Myr
  CFL: 0.4
  dtmin:
    value: 1.0e3
    unit: yr
  dtmax:
    value: 10.0
    unit: Myr
  boundcond: OutflowSph
  # Match the innermost HM12-PIE equilibrium cell.  OutflowSph uses these
  # values in the inner ghost cells; the generic defaults (1 g cm^-3, 0 K)
  # would inject an unphysical central spike.
  vel_outflow:
    value: 19.533
    unit: km/s
  rho_outflow:
    value: 4.04955e-27
    unit: g/cm**3
  temp_outflow:
    value: 10109.1
    unit: K
  mu_outflow: 0.59
  verbose: 0
  order: 0
  noghost: 2
  thermochemistry_network: pie_uvbg_cooling
  metal_pie_enabled: true
  metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
  metal_pie_redshift: 0.0
  metal_pie_photoheating_max_density_cm3: 50.0
  metallicity: 1.0
  hydrogen_mass_fraction: 0.76
  cooling_safety_factor: 0.05
  # The PIE update is implicit; these controls avoid excessive retries in
  # the very cold initial cells while retaining a converged thermal solve.
  pie_uvbg_implicit_tolerance: 5.0e-3
  pie_uvbg_implicit_max_iterations: 16
  pie_uvbg_implicit_max_retries: 4
  pie_uvbg_implicit_step_doubling: false
  cooling_temperature_floor:
    value: 100.0
    unit: K
  radiative_transfer: false

ICparams:
  nogrid: 256
  coordsys: spherical
  boxsize:
    value: 560.0
    unit: kpc
  time:
    value: 0.0
    unit: Myr
  rmin:
    value: 1.4
    unit: kpc
  rmax:
    value: 560.0
    unit: kpc
  halo_mass:
    value: 3.0e11
    unit: Msun
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0:
    value: 70.0
    unit: km/(s*Mpc)
  omega_b: 0.049
  omega_m: 0.3
  omega_lambda: 0.7
  initial_redshift: 0.0
  mu: 0.59
  cmb_temperature_0:
    value: 2.7255
    unit: K
  initial_temperature:
    value: 2.7255
    unit: K
  density_fluctuation_amplitude: 8.0
  density_fluctuation_slope: 1.8
  density_fluctuation_floor: 0.25
