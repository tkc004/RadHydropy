par:
  simulation:
    name: StaticStromgrenSpherePhotoheating1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 500.0, unit: Myr}
  mesh:
    grid_cells: 1024
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.5
    order: 0
  boundary:
    condition: OpenSph
  timestep:
    dtmin: {value: 1.0e-6, unit: Myr}
    dtmax: {value: 1.0, unit: Myr}
    evolution_timestep: {value: 1.0, unit: Myr}
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 4.92e31
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  chemistry:
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 1.0
    hydrogen_xHI_inflow: 1.0
    hydrogen_xHI_outflow: 1.0
  thermochemistry:
    hydrogen_chemistry: true
    hydrogen_source_CFL: 0.1
    hydrogen_source_dtmin: {value: 0.0, unit: Myr}
    hydrogen_update_mu: true
    hydrogen_thermal_coupling: true
    hydrogen_recombination: true
    hydrogen_collisional_ionization: true
    hydrogen_alpha_B: null
    hydrogen_beta: null
    hydrogen_ngamma_initial: {value: 0.0, unit: 1/cm**3}
    hydrogen_sigma_gamma: {value: 1.62e-18, unit: cm**2}
    hydrogen_epsilon_gamma: {value: 6.33, unit: eV}
  radiation:
    radiative_transfer: true
    radiative_transfer_method: long_characteristics
    radiative_transfer_boundary_flux: {value: 0.0, unit: 1/(cm**2*s)}
    radiative_transfer_source_photon_rate: {value: 5.0e48, unit: 1/s}
    radiative_transfer_direction: 1
  output:
    directory: .
    savedir: .
    filename_prefix: Output
  diagnostics:
    verbose: 0
initial_condition:
  hydrogen_number_density: {value: 1.0e-3, unit: 1/cm**3}
  box_size: {value: 20.0, unit: kpc}
  initial_temperature: {value: 100.0, unit: K}
  time: {value: 0.0, unit: Myr}
example:
  reference_time: {value: 100.0, unit: Myr}
  plot_radius_max: {value: 7.5, unit: kpc}
  reference_radius_unit: {value: 5.4, unit: kpc}
  temperature_reference_filename: TTT1Dthin_Stromgren100Myr.txt
  neutral_fraction_reference_filename: xTT1Dthin_Stromgren100Myr.txt
  analytic_inner_radius: {value: 0.1, unit: kpc}
