runparams:
  simname: StaticStromgrenSpherePhotoheating1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  savedir: .
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 4.92e31
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  hydrogen_number_density:
    value: 1.0e-3
    unit: 1/cm**3
  area:
    value: 1.0
    unit: kpc**2
  alpha_B_coefficient:
    value: 2.59e-13
    unit: cm**3/s
  sigma_gamma:
    value: 1.62e-18
    unit: cm**2
  source_photon_rate:
    value: 5.0e48
    unit: 1/s
  epsilon_gamma:
    value: 6.33
    unit: eV
  boxsize:
    value: 20.0
    unit: kpc
  dtmin:
    value: 1.0e-6
    unit: Myr
  dtmax:
    value: 1.0
    unit: Myr
  plot_radius_max:
    value: 7.5
    unit: kpc
  final_time:
    value: 500.0
    unit: Myr
  reference_time:
    value: 100.0
    unit: Myr
  reference_radius_unit:
    value: 5.4
    unit: kpc
  evolution_timestep:
    value: 1.0
    unit: Myr
  hydrogen_source_dtmin:
    value: 0.0
    unit: Myr
  evolution_timestep_cfl: 0.1
  radiative_transfer_update_interval: 5
  number_of_cells: 1024
  hydrogen_beta:
    value: 0.0
    unit: cm**3/s
  hydrogen_ngamma_initial:
    value: 0.0
    unit: 1/cm**3
  radiative_transfer_boundary_flux:
    value: 0.0
    unit: 1/(cm**2*s)
  analytic_inner_radius:
    value: 0.1
    unit: kpc
  initial_temperature:
    value: 100.0
    unit: K
  temperature_reference_filename: TTT1Dthin_Stromgren100Myr.txt
  neutral_fraction_reference_filename: xTT1Dthin_Stromgren100Myr.txt
