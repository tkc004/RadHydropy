par:
  simulation:
    name: outflow_spherical
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 2.0, unit: s}
  mesh:
    ghost_cells: 100
    grid_cells: 1000
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 0
  boundary:
    condition: OutflowSph
    outflow_velocity: {value: 1.0, unit: cm/s}
    outflow_density: {value: 1.0, unit: g/cm**3}
    outflow_temperature: {value: 0.0, unit: K}
    outflow_mu: 1.0
  timestep:
    dtmin: {value: 2.0e-8, unit: s}
    dtmax: {value: 2.0e-2, unit: s}
  output:
    directory: .
    filename_prefix: Output
    cadence: {value: 0.2, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0

initial_condition:
  grid_cells: 1000
  coordinate_system: spherical
  box_size_proper: {value: 2.0, unit: cm}
  radius_injection_proper: {value: 0.2, unit: cm}
  time_proper: {value: 0.0, unit: s}
  temperature_proper: {value: 0.0, unit: K}
  mean_molecular_weight: 1.0
  vel_proper: {value: 0.0, unit: cm/s}
  rho_proper: {value: 0.001, unit: g/cm**3

}
example:
  plot:
    filename: OutflowSph1D.jpg
    markevery: 5
  output_indices: [0, 2, 4, 6, 8]
