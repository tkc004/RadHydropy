runparams:
  simname: advection1d
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outdeltatime:
    value: 0.2
    unit: s
  savedir: .
  coordsys: spherical
  EOStype: polytropic
  gamma: 1.4
  timesim:
    value: 2.0
    unit: s
  CFL: 0.1
  boundcond: OutflowSph
  vel_outflow:
    value: 1.0
    unit: cm/s
  rho_outflow:
    value: 1.0
    unit: g/cm**3
  temp_outflow:
    value: 0.0
    unit: K
  mu_outflow: 1.0
  verbose: 0
  order: 0
  noghost: 100
  dtmin:
    value: 2.0e-8
    unit: s
  dtmax:
    value: 2.0e-2
    unit: s

ICparams:
  nogrid: 1000
  coordsys: spherical
  boxsize:
    value: 2.0
    unit: cm
  rinj:
    value: 0.2
    unit: cm
  time:
    value: 0.0
    unit: s
  tempini:
    value: 0.0
    unit: K
  muini: 1.0
  vini:
    value: 0.0
    unit: cm/s
  rhoini:
    value: 0.001
    unit: g/cm**3
