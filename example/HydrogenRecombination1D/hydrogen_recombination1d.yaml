par:
  simulation:
    name: HydrogenRecombination1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: cartesian
    final_time:
      value: 5.0e5
      unit: yr
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.5
    order: 0
  boundary:
    condition: Periodic
    inflow_velocity: {value: 0.0, unit: cm/s}
    inflow_density: {value: 1.0, unit: mp/cm**3}
    inflow_temperature: {value: 0.0, unit: K}
    inflow_mu: 1.0
    outflow_velocity: {value: 0.0, unit: cm/s}
    outflow_density: {value: 1.0, unit: mp/cm**3}
    outflow_temperature: {value: 0.0, unit: K}
    outflow_mu: 1.0
  timestep:
    dtmin: {value: 1.0e-6, unit: yr}
    dtmax: {value: 2.0e3, unit: yr}
    hydrogen_source_CFL: 0.2
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    cadence: {value: 1.0e4, unit: yr}
  diagnostics:
    verbose: 0
  chemistry:
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 0.0
    hydrogen_xHI_inflow: 0.0
    hydrogen_xHI_outflow: 0.0
  thermochemistry:
    hydrogen_chemistry: true
    hydrogen_update_mu: false
    hydrogen_thermal_coupling: false
    hydrogen_recombination: true
    hydrogen_collisional_ionization: false
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0

initial_condition:
  grid_cells: 16
  coordinate_system: cartesian
  box_size:
    value: 1.0
    unit: kpc
  current_time:
    value: 0.0
    unit: yr
  hydrogen_number_density:
    value: 100.0
    unit: 1/cm**3
  temperature:
    value: 2.0e4
    unit: K
  neutral_fraction: 0.0
  mean_molecular_weight: 0.5

example:
  target_neutral_fraction: 0.99
  plot_filename: HydrogenRecombination1D.jpg
