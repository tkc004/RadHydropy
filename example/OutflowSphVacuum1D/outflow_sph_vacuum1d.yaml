par:
  simulation:
    name: outflow_sph_vacuum1d
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 1.0e-7, unit: s}
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 1
  boundary:
    condition: OutflowSph
    outflow_velocity: {value: 1.0e6, unit: cm/s}
    outflow_density: {value: 1.0e-6, unit: g/cm**3}
    outflow_temperature: {value: 0.0, unit: K}
    outflow_mu: 1.0
  timestep:
    dtmin: {value: 1.0e-12, unit: s}
    dtmax: {value: 2.0e-8, unit: s}
  output:
    directory: .
    filename_prefix: Output
    cadence: {value: 2.0e-8, unit: s}
  diagnostics:
    verbose: 0
  # Exact vacuum interfaces can leave roundoff mass in a cell.  Treat that
  # numerical debris as vacuum without flooring the conserved state.
  cfl_density_floor: 1.0e-9
  hydro_temperature_floor: {value: 2.0, unit: K}
  temperature_jump_error_threshold: 1.0e8
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0

initial_condition:
  grid_cells: 256
  coordinate_system: spherical
  box_size: {value: 2.0, unit: cm}
  injection_radius: {value: 0.2, unit: cm}
  current_time: {value: 0.0, unit: s}
  initial_temperature: {value: 0.0, unit: K}
  mean_molecular_weight: 1.0
  initial_velocity: {value: 0.0, unit: cm/s}
  initial_density: {value: 0.0, unit: g/cm**3}

example:
  plot_filename: OutflowSphVacuum1D.jpg
