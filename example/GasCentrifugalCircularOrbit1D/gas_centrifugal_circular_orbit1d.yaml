par:
  simulation:
    name: GasCentrifugalCircularOrbit1D
    coordinate_system: spherical
    initial_condition_filename: outputs/InitialCondition.hdf5
    final_time: {value: 0.1, unit: s}
  mesh: {grid_cells: 64, ghost_cells: 2}
  hydrodynamics: {eos_type: polytropic, gamma: 1.4, order: 0, CFL: 0.05, gas_angular_momentum: true, gas_rotational_energy: true}
  boundary: {condition: Reflecting}
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 1.0e-3, unit: s}
  output: {directory: outputs, savedir: outputs, filename_prefix: Output, cadence: {value: 0.05, unit: s}}
  units:
    CodeUnits:
      name: gas_centrifugal_circular_orbit_units
      InternalUnitSystem: {UnitMass_in_cgs: 1.0, UnitLength_in_cgs: 1.0, UnitVelocity_in_cgs: 1.0, UnitCurrent_in_cgs: 1.0, UnitTemp_in_cgs: 1.0}
initial_condition:
  radius_min: 0.5
  radius_max: 1.5
  radius: 1.0
  central_mass: 1.0
  density: 1.0
  radial_velocity: 0.0
  pressure: 1.0e-8
  timestep: 1.0e-3
  nsteps: 100
example: {}
