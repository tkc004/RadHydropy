par:
  simulation:
    name: GasCentrifugalCircularOrbit1D
    coordinate_system: spherical
    initial_condition_filename: outputs/InitialCondition.hdf5
    final_time: {value: 0.1, unit: s}
  mesh:
    grid_cells: 64
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    order: 0
    CFL: 0.05
    gas_angular_momentum: true
    gas_rotational_energy: true
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 1.0e-3, unit: s}
  output:
    directory: outputs
    savedir: outputs
    filename_prefix: Output
    cadence: {value: 0.05, unit: s}
  units:
    CodeUnits:
      name: gas_centrifugal_circular_orbit_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  radius_inner_proper: {value: 0.5, unit: cm}
  radius_outer_proper: {value: 1.5, unit: cm}
  radius_proper: {value: 1.0, unit: cm}
  central_mass_proper: {value: 1.0, unit: g}
  rho_proper: {value: 1.0, unit: g/cm**3}
  vel_proper: {value: 0.0, unit: cm/s}
  pressure_proper: {value: 1.0e-8, unit: erg/cm**3}
  timestep: 1.0e-3
  nsteps: 100
example: {}
