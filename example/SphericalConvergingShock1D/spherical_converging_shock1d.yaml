par:
  simulation:
    name: SphericalConvergingShock1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.8, unit: s}
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 1
    riemann_solver: Rusanov
    dual_energy: true
    # Bryan et al. dual-energy switching: eta1 selects the pressure source;
    # eta2 controls when InternalEnergy is synchronized to conservative E-K.
    dual_energy_eta1: 1.0e-3
    dual_energy_eta2: 1.0e-1
    # Reject a dual-energy update that loses more than this fraction of its
    # previous thermal state when conservative E-K is not a valid recovery.
    dual_energy_consistency_factor: 1.0e-1
    # This benchmark relies on the dual-energy switch and consistency
    # recovery; the experimental entropy limiter is intentionally disabled.
    dual_energy_entropy_limiter: false
    dual_energy_pressure_selection: switch
    # Code-unit pressure used only when both thermal-energy estimates fail.
    dual_energy_pressure_floor: 1.0e-20
    cfl_density_floor: 1.0e-12
    temperature_jump_error_threshold: 1.0e12
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 2.0e-3, unit: s}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    cadence: {value: 0.05, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 512
  coordinate_system: spherical
  box_size: {value: 1.0, unit: cm}
  current_time: {value: 0.0, unit: s}
  initial_density: {value: 1.0, unit: g/cm**3}
  temperature: {value: 1.0e-10, unit: K}
  mean_molecular_weight: 1.0
  velocity: {value: -1.0, unit: cm/s}
example:
  plot_filename: SphericalConvergingShock1D.jpg
