par:
  simulation:
    name: SphericalConvergingShock1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.8, unit: s}
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 1
    riemann_solver: Rusanov
    dual_energy: false
    temperature_jump_error_threshold: 1.0e12
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 2.0e-3, unit: s}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    cadence: {value: 0.05, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 512
  coordinate_system: spherical
  box_size: {value: 1.0, unit: cm}
  current_time: {value: 0.0, unit: s}
  initial_density: {value: 1.0, unit: g/cm**3}
  temperature: {value: 1.0e-10, unit: K}
  mean_molecular_weight: 1.0
  velocity: {value: -1.0, unit: cm/s}
example:
  plot_filename: SphericalConvergingShock1D.jpg
