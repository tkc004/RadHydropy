runparams:
  simname: PIEUVBGPhotoionizationTimescale1D
  ICfilename: InitialCondition.hdf5
  outdir: outputs
  outfileprefix: Output
  savedir: outputs
  coordsys: cartesian
  EOStype: polytropic
  gamma: 1.6666666666666667
  timesim:
    value: 1.1e5
    unit: yr
  outdeltatime:
    value: 1.0e4
    unit: yr
  outputtimefilename: pie_uvbg_photoionization_timescale_1d_output_times.txt
  CFL: 0.3
  dtmax:
    value: 1.0e6
    unit: yr
  dtmin:
    value: 1.0e-6
    unit: yr
  boundcond: Periodic
  verbose: 0
  order: 0
  thermochemistry_network: pie_uvbg_cooling
  metal_pie_enabled: true
  metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
  metal_pie_redshift: 4.0
  metal_pie_photoheating_max_density_cm3: 50.0
  metallicity: 1.0
  hydrogen_mass_fraction: 0.7
  radiative_transfer: false
  cooling_temperature_floor:
    value: 100.0
    unit: K
  pie_uvbg_implicit_tolerance: 1.0e-3
  pie_uvbg_photoionization_timescale:
    value: 1.0e4
    unit: yr
  CodeUnits:
    name: cgs_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0
      UnitLength_in_cgs: 1.0
      UnitVelocity_in_cgs: 1.0
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 1
  coordsys: cartesian
  boxsize:
    value: 1.0
    unit: pc
  time:
    value: 0.0
    unit: yr
  tempini:
    value: 2.0e4
    unit: K
  muini: 0.62
  hydrogen_mass_fraction: 0.7
  proton_mass_g: 1.67262192369e-24
  nHini: 1.0
  vini:
    value: 0.0
    unit: cm/s
