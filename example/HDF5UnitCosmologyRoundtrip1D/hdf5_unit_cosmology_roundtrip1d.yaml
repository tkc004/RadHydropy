par:
  simulation:
    name: HDF5UnitCosmologyRoundtrip1D
    coordinate_system: cartesian
    initial_condition_filename: InitialCondition.hdf5
  mesh:
    grid_cells: 4
    ghost_cells: 0
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    order: 0
    CFL: 0.2
  cosmology:
    cosmological: false
    cosmological_expansion: false
    supercomoving_coordinates: false
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: {value: 1.0, unit: s}
    cosmology_a_ref: 1.0
  gravity:
    selfgravity: false
  boundary:
    condition: Reflecting
  timestep:
    dtmin: 1.0e-8
    dtmax: {value: 1.0, unit: s}
  units:
    CodeUnits:
      name: placeholder
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size_proper: {value: 2.0, unit: pc}
  time_cosmic: {value: 1.0, unit: s}
  density_proper: {value: 3.0e-24, unit: g/cm**3}
  temperature_proper: {value: 100.0, unit: K}
  velocity_proper: {value: 2.0, unit: km/s}
  mean_molecular_weight: 1.0
example:
  cases:
    proper_cgs:
      cosmological_expansion: false
      supercomoving_coordinates: false
      cosmology_type: einstein_de_sitter
      CodeUnits:
        name: proper_cgs
        InternalUnitSystem:
          UnitMass_in_cgs: 1.0
          UnitLength_in_cgs: 1.0
          UnitVelocity_in_cgs: 1.0
          UnitCurrent_in_cgs: 1.0
          UnitTemp_in_cgs: 1.0
    proper_astrophysical:
      cosmological_expansion: false
      supercomoving_coordinates: false
      cosmology_type: einstein_de_sitter
      CodeUnits:
        name: proper_astrophysical
        InternalUnitSystem:
          UnitMass_in_cgs: 1.0e33
          UnitLength_in_cgs: 3.08567758e18
          UnitVelocity_in_cgs: 1.0e5
          UnitCurrent_in_cgs: 1.0
          UnitTemp_in_cgs: 1.0
    cosmological_astrophysical:
      cosmological_expansion: true
      supercomoving_coordinates: true
      cosmology_type: einstein_de_sitter
      CodeUnits:
        name: cosmological_astrophysical
        InternalUnitSystem:
          UnitMass_in_cgs: 1.0e33
          UnitLength_in_cgs: 3.08567758e18
          UnitVelocity_in_cgs: 1.0e5
          UnitCurrent_in_cgs: 1.0
          UnitTemp_in_cgs: 1.0
