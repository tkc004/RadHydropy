par:
  simulation:
    name: NFWBoundaryDrivenVirialShock1D
    initial_condition_filename: outputs/InitialCondition.hdf5
    coordinate_system: spherical
    final_time:
      value: 800.0
      unit: Myr
  mesh:
    grid_cells: 512
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.2
    order: 0
  boundary:
    condition: InflowSph
  timestep:
    dtmin:
      value: 1000.0
      unit: yr
    dtmax:
      value: 2.0
      unit: Myr
  output:
    directory: outputs/adiabatic
    savedir: outputs
    filename_prefix: Output
    time_list_filename: adiabatic_output_times.txt
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e12
        UnitLength_in_cgs: 3.0856775814913673e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  chemistry:
    hydrogen_mass_fraction: 0.76
  thermochemistry:
    thermochemistry_network: hydrogen
    metallicity: 0.1
    pie_uvbg_implicit_step_doubling: false
    cooling_safety_factor: 0.05
    cooling_temperature_floor:
      value: 100.0
      unit: K
    pie_uvbg_implicit_max_iterations: 16
    pie_uvbg_implicit_tolerance: 0.005
    metal_pie_enabled: false
    metal_pie_redshift: 0.0
    metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
    metal_pie_photoheating_max_density_cm3: 50.0
    pie_uvbg_implicit_max_retries: 4
  radiation:
    radiative_transfer: false
  diagnostics:
    verbose: 0
initial_condition:
  time:
    value: 0.0
    unit: Myr
  halo_mass:
    value: 1.0e12
    unit: Msun
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0:
    value: 70.0
    unit: km/(s*Mpc)
  mu: 0.59
  inner_radius_over_R200: 0.02
  outer_radius_over_R200: 4.0
  atmosphere_radius_over_R200: 0.8
  transition_width_over_R200: 0.05
  inflow_velocity_over_V200: 1.25
  baryon_accretion_rate:
    value: 30.0
    unit: Msun/yr
  atmosphere_ram_pressure_fraction: 0.75
example:
  adiabatic_final_time:
    value: 800.0
    unit: Myr
  pie_final_time:
    value: 1200.0
    unit: Myr
  pie_outdir: outputs/pie
  pie_outputtimefilename: pie_output_times.txt
