runparams:
  simname: NFWBoundaryDrivenVirialShock1D
  ICfilename: outputs/InitialCondition.hdf5
  outdir: outputs/adiabatic
  pie_outdir: outputs/pie
  outfileprefix: Output
  outputtimefilename: adiabatic_output_times.txt
  pie_outputtimefilename: pie_output_times.txt
  savedir: outputs
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0e12
      UnitLength_in_cgs: 3.0856775814913673e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0
  coordsys: spherical
  EOStype: polytropic
  gamma: 1.6666666666666667
  adiabatic_final_time: {value: 800.0, unit: Myr}
  # Restart snapshots currently begin a fresh stage clock.  Evolve for another
  # 1.2 Gyr after the 0.8-Gyr settling stage (2 Gyr total physical evolution).
  pie_final_time: {value: 1200.0, unit: Myr}
  timesim: {value: 800.0, unit: Myr}
  CFL: 0.2
  dtmin: {value: 1000.0, unit: yr}
  dtmax: {value: 2.0, unit: Myr}
  boundcond: InflowSph
  verbose: 0
  order: 0
  noghost: 2
  thermochemistry_network: hydrogen
  metal_pie_enabled: false
  metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
  metal_pie_redshift: 0.0
  metal_pie_photoheating_max_density_cm3: 50.0
  metallicity: 0.1
  hydrogen_mass_fraction: 0.76
  cooling_safety_factor: 0.05
  pie_uvbg_implicit_tolerance: 5.0e-3
  pie_uvbg_implicit_max_iterations: 16
  pie_uvbg_implicit_max_retries: 4
  pie_uvbg_implicit_step_doubling: false
  cooling_temperature_floor: {value: 100.0, unit: K}
  radiative_transfer: false

ICparams:
  nogrid: 512
  time: {value: 0.0, unit: Myr}
  halo_mass: {value: 1.0e12, unit: Msun}
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0: {value: 70.0, unit: km/(s*Mpc)}
  mu: 0.59
  inner_radius_over_R200: 0.02
  outer_radius_over_R200: 4.0
  atmosphere_radius_over_R200: 0.8
  transition_width_over_R200: 0.05
  inflow_velocity_over_V200: 1.25
  baryon_accretion_rate: {value: 30.0, unit: Msun/yr}
  atmosphere_ram_pressure_fraction: 0.75
