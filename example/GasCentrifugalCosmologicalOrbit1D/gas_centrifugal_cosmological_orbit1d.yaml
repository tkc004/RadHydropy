par:
  simulation:
    name: GasCentrifugalCosmologicalOrbit1D
    coordinate_system: spherical
    initial_condition_filename: outputs/InitialCondition.hdf5
    final_time: 0.4
  mesh:
    grid_cells: 32
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    order: 0
    CFL: 0.05
    positivity_preserving: false
    dual_energy: true
    gas_angular_momentum: true
    gas_rotational_energy: true
  gravity:
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: false
    selfgravity: false
    externalgravity: false
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 1.0
    cosmology_a_ref: 1.0
  boundary:
    condition: Periodic
  timestep:
    dtmin: 1.0e-8
    dtmax: 0.001
  output:
    directory: outputs
    filename_prefix: Output
    cadence: 0.2
  units:
    CodeUnits:
      name: gas_centrifugal_cosmological_orbit_units
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  radius_inner_comoving: {value: 0.5, unit: pc}
  radius_outer_comoving: {value: 1.5, unit: pc}
  rho_proper: {value: 1.0, unit: g/cm**3}
  radius_initial_comoving: 1.0
  vel_initial_supercomoving_code: 0.0
  central_excess_mass: 1.0
  angular_momentum_fraction_of_circular: 0.7
  temperature_proper: {value: 1.0e-8, unit: K}
example:
  timestep: 0.0005
