par:
  simulation:
    name: CosmologicalGasCorrelationZ100ComptonAtomic_LambdaCDM
    initial_condition_filename: outputs_correlation_gas_compton_atomic_lcdm/InitialCondition.hdf5
    coordinate_system: spherical
    final_time: 1.832399728
  mesh: {grid_cells: 256, ghost_cells: 2}
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    order: 1
    dual_energy: true
    CFL: 0.10
    cfl_density_floor: 9.3e-20
    temperature_jump_error_threshold: 1.0e8
  boundary: {condition: InflowSph, cosmological_background_boundary_reconstruction: true}
  timestep:
    dtmin: {value: 1.0e-12, unit: Myr}
    dtmax: {value: 200.0, unit: Myr}
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: lambda_cdm
    cosmology_t_ref: 14.4
    cosmology_a_ref: 1.0
    cosmology_omega_m: 0.3
    cosmology_omega_lambda: 0.7
    cosmology_hubble_ref: 0.07
  dark_matter: {crossing_safety_factor: 0.5, crossing_batch_fraction: 0.01, global_timestep_limit: false, smooth_force_for_gas: true}
  thermochemistry:
    network: hydrogen
    hydrogen_chemistry: true
    hydrogen_xHI_initial: 0.9998
    hydrogen_recombination: true
    hydrogen_collisional_ionization: true
    hydrogen_atomic_cooling: true
    hydrogen_update_mu: true
    hydrogen_thermal_coupling: true
    compton_only: false
    hydrogen_source_solver: split_implicit
    hydrogen_source_skip_floor_cells: true
    hydrogen_source_density_floor: {value: 1.0e-26, unit: g/cm**3}
    hydrogen_source_floor_temperature_tolerance: 1.0e-2
    hydrogen_hybrid_change_tolerance: 0.10
    hydrogen_implicit_tolerance: 1.0e-4
    hydrogen_implicit_absolute_temperature_tolerance: {value: 0.1, unit: K}
    hydrogen_implicit_fallback: error
    hydrogen_implicit_debug: false
    hydrogen_implicit_max_refinements: 24
    cie_cooling: false
    metal_pie_enabled: false
    compton_cmb_enabled: true
    compton_cmb_redshift: 100.0
    cmb_temperature_0: {value: 2.7255, unit: K}
    hydrogen_mass_fraction: 0.76
  output: {directory: outputs_correlation_gas_compton_atomic_lcdm, savedir: outputs_correlation_gas_compton_atomic_lcdm, filename_prefix: Output}
  units:
    CodeUnits:
      name: cosmological_gas_correlation_compton_atomic_unit_system
      InternalUnitSystem: {UnitMass_in_cgs: 1.98847e43, UnitLength_in_cgs: 3.085677581e21, UnitVelocity_in_cgs: 1.0e5, UnitCurrent_in_cgs: 1.0, UnitTemp_in_cgs: 1.0}
initial_condition:
  nogrid: 256
  rmin: 3.0
  rmax: 4000.0
  verbal: 1
  initial_cosmic_time: 0.64428210447
  perturbation_radius: 250.0
  target_halo_mass: 100.0
  initial_overdensity: 0.0166930693
  initial_density_profile: linear_correlation
  correlation_h: 0.674
  baryon_fraction: 0.157
  hydrogen_mass_fraction: 0.76
  mu: 0.59
  dark_matter_shells: 1024
  dm_inner_radius: 0.01
  specific_angular_momentum: 1500.0
  dm_specific_angular_momentum: 0.02
  softening: 0.2
  cmb_equilibrium_initial: true
  cmb_temperature_0: 2.7255
  cmb_residual_electron_fraction: 2.0e-4
example:
  figure_prefix: CosmologicalGasCorrelationZ100_ComptonAtomic
  cosmological_background_boundary_reconstruction: true
  dark_matter_crossing_safety_factor: 0.5
  dark_matter_crossing_batch_fraction: 0.01
  dark_matter_global_timestep_limit: false
  smooth_dm_force_for_gas: true
  dm_density_bins: 128
  gas_profile_cadence: 0.10
  linear_correlation_table_filename: ../CosmologicalVirialShock1D/outputs_correlation/lcdm_linear_correlation.h5
  minimum_temperature: {value: 2.69851485e-5, unit: K}
  temperature_plot_ymin: {value: 1.0, unit: K}
