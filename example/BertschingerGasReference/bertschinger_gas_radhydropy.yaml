par:
  simulation:
    name: BertschingerGasReferenceRadHydro
    initial_condition_filename: InitialCondition_RadHydro.hdf5
    coordinate_system: spherical
    final_time: 0.291535719769
  mesh:
    grid_cells: 8192
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.15
    order: 0
    temperature_jump_error_threshold: 1.0e99
  boundary:
    condition: OutflowSph
    rho_outflow_proper: {value: 8.0e-22, unit: g/cm**3}
    temperature_outflow_proper: {value: 7.0e5, unit: K}
    vel_outflow_proper: {value: 0.0, unit: km/s}
    outflow_mu: 0.6
  timestep:
    dtmin: {value: 1.0e-5, unit: yr}
    dtmax: {value: 1.0e-3, unit: Myr}
  output:
    directory: .
    savedir: .
    filename_prefix: Output_RadHydro
    cadence: 0.001
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: bertschinger_gas_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 4.42e44
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 9.77792221e7
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  gravity:
    selfgravity: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: 0.1
    cosmology_a_ref: 1.0
    externalgravity: false
initial_condition:
  box_size_proper: {value: 800.0, unit: kpc}
  radius_inner_proper: {value: 0.15, unit: kpc}
  radius_outer_proper: {value: 800.0, unit: kpc}
  time_cosmic: 0.1
  perturbation_amplitude: 5.0
  mean_molecular_weight: 0.6
  temperature_proper: {value: 1.0e-6, unit: K}
example: {}
