runparams:
  simname: MultiFrequencyRadiativeTransferSph1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  savedir: .
  coordsys: spherical
  boundcond: OpenSph
  noghost: 2
  hydrogen_chemistry: true
  hydrogen_mass_fraction: 1.0
  hydrogen_update_mu: true
  hydrogen_thermal_coupling: true
  hydrogen_recombination: true
  hydrogen_collisional_ionization: true
  hydrogen_alpha_B: null
  hydrogen_beta: null
  radiative_transfer: true
  radiative_transfer_method: long_characteristics
  radiative_transfer_direction: 1
  radiation_spectrum_filename: radiation_spectrum_BB100000K_3groups_HI.h5
  explicit_tolerance: 0.1
  relative_tolerance: 1.0e-3
  absolute_tolerance: 1.0e-10
  reference_radius_unit:
    value: 5.4
    unit: kpc
  temperature_reference_filename: TTT1D_Stromgren100Myr.txt
  neutral_fraction_reference_filename: xTT1D_Stromgren100Myr.txt
  timesim:
    value: 100.0
    unit: Myr
  final_time:
    value: 100.0
    unit: Myr
  evolution_timestep:
    value: 0.5
    unit: Myr
  initial_temperature:
    value: 100.0
    unit: K
  hydrogen_number_density:
    value: 1.0e-3
    unit: 1/cm**3
  boxsize:
    value: 10.0
    unit: kpc
  number_of_cells: 512
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.98841586e33
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  number_of_cells: 512
  boxsize:
    value: 10.0
    unit: kpc
  hydrogen_number_density:
    value: 1.0e-3
    unit: 1/cm**3
  initial_temperature:
    value: 100.0
    unit: K
