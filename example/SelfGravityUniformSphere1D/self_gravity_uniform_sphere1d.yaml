runparams:
  simname: SelfGravityUniformSphere1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  savedir: .
  coordsys: spherical
  selfgravity: true
  externalgravity: false
  timesim:
    value: 0.0
    unit: s
  CodeUnits:
    name: self_gravity_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0e33
      UnitLength_in_cgs: 3.08567758e18
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0
  noghost: 2
  verbose: 0

ICparams:
  nogrid: 128
  coordsys: spherical
  boxsize:
    value: 1.0
    unit: pc
  rmin:
    value: 0.0
    unit: pc
  rmax:
    value: 1.0
    unit: pc
  time:
    value: 0.0
    unit: s
  rho0:
    value: 1.0e-20
    unit: g/cm**3
  tempini:
    value: 10.0
    unit: K
  muini: 1.0
