par:
  simulation:
    name: SelfGravityUniformSphere1D
    coordinate_system: spherical
    initial_condition_filename: InitialCondition.hdf5
    final_time: {value: 0.0, unit: s}
  mesh:
    grid_cells: 128
    ghost_cells: 2
  gravity:
    selfgravity: true
    externalgravity: false
  output:
    directory: .
    filename_prefix: Output
  units:
    CodeUnits:
      name: self_gravity_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  coordsys: spherical
  box_size_proper: {value: 1.0, unit: pc}
  radius_inner_proper: {value: 0.0, unit: pc}
  radius_outer_proper: {value: 1.0, unit: pc}
  time_proper: {value: 0.0, unit: s}
  rho_proper: {value: 1.0e-20, unit: g/cm**3}
  temperature_proper: {value: 10.0, unit: K}
  mean_molecular_weight: 1.0
example: {}
