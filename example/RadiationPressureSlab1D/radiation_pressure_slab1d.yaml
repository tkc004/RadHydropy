par:
  simulation:
    name: RadiationPressureSlab1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: cartesian
    final_time: {value: 1.0e5, unit: s}
  mesh:
    grid_cells: 64
    ghost_cells: 2
    area_proper: {value: 1.0, unit: cm**2}
  boundary:
    condition: Periodic
    rho_inflow_proper: {value: 1.0e-22, unit: g/cm**3}
    vel_inflow_proper: {value: 0.0, unit: cm/s}
    temperature_inflow_proper: {value: 100.0, unit: K}
    inflow_mu: 1.0
    rho_outflow_proper: {value: 1.0e-22, unit: g/cm**3}
    vel_outflow_proper: {value: 0.0, unit: cm/s}
    temperature_outflow_proper: {value: 100.0, unit: K}
    outflow_mu: 1.0
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.3
    order: 0
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 5.0e2, unit: s}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
  chemistry:
    hydrogen_chemistry: true
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 1.0
    hydrogen_xHI_inflow: 1.0
    hydrogen_xHI_outflow: 1.0
    hydrogen_source_CFL: 1000000.0
    hydrogen_update_mu: false
  thermochemistry:
    thermochemistry_network: hydrogen
    hydrogen_thermal_coupling: false
    hydrogen_recombination: false
    hydrogen_collisional_ionization: false
    hydrogen_radiation_field: false
    hydrogen_radiation_evolution: false
    hydrogen_sigma_gamma: {value: 6.3e-18, unit: cm**2}
    hydrogen_epsilon_gamma: {value: 6.4, unit: eV}
    hydrogen_photon_energy: {value: 20.0, unit: eV}
  radiation:
    radiative_transfer: true
    radiative_transfer_method: long_characteristics
    radiative_transfer_temporal_scheme: instantaneous
    radiative_transfer_boundary_flux: {value: 1.0e12, unit: 1/(cm**2*s)}
    radiative_transfer_source_photon_rate: {value: 0.0, unit: 1/s}
    radiative_transfer_direction: 1
    radiation_pressure: true
    radiation_pressure_efficiency: 1.0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size_proper: {value: 1.0e10, unit: cm}
  time_proper: {value: 0.0, unit: s}
  rho_proper: {value: 1.0e-22, unit: g/cm**3}
  vel_proper: {value: 0.0, unit: cm/s}
  temperature_proper: {value: 100.0, unit: K}
  mean_molecular_weight: 1.0
example: {}
