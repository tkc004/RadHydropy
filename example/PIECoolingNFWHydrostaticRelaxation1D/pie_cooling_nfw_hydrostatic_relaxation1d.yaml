runparams:
  simname: PIECoolingNFWHydrostaticRelaxation1D
  ICfilename: InitialCondition.hdf5
  outdir: outputs
  outfileprefix: Output
  savedir: .
  outputtimefilename: pie_cooling_nfw_hydrostatic_relaxation1d_output_times.txt
  coordsys: spherical
  EOStype: polytropic
  gamma: 1.6666666666666667
  timesim:
    value: 5000.0
    unit: Myr
  CFL: 0.2
  dtmin:
    value: 1.0e2
    unit: yr
  dtmax:
    value: 2.0
    unit: Myr
  boundcond: OutflowSph
  # Match the prescribed inner outflow state to the central hydrostatic gas.
  # The OutflowSph implementation uses these values in the inner ghost cells.
  vel_outflow:
    value: 0.0
    unit: km/s
  rho_outflow:
    value: 1.6e-26
    unit: g/cm**3
  temp_outflow:
    value: 5000.0
    unit: K
  mu_outflow: 0.59
  verbose: 0
  order: 0
  noghost: 2
  thermochemistry_network: pie_uvbg_cooling
  metal_pie_enabled: true
  metal_pie_table_filename: ../../../metal_pie_table/metal_pie_hm12_total.h5
  metal_pie_redshift: 0.0
  metal_pie_photoheating_max_density_cm3: 50.0
  metallicity: 1.0
  hydrogen_mass_fraction: 0.76
  cooling_safety_factor: 0.05
  cooling_temperature_floor:
    value: 100.0
    unit: K
  radiative_transfer: false
  runaway_density_factor: 100.0
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 5.497e8
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 512
  coordsys: spherical
  boxsize:
    value: 80.0
    unit: kpc
  time:
    value: 0.0
    unit: Myr
  rmin:
    value: 0.01
    unit: kpc
  rmax:
    value: 80.0
    unit: kpc
  halo_mass:
    value: 5.497e8
    unit: Msun
  concentration: 10.0
  redshift: 0.0
  overdensity: 200.0
  h0:
    value: 70.0
    unit: km/(s*Mpc)
  gas_fraction: 0.157
  mu: 0.59
  rho_ref:
    value: 1.0e-27
    unit: g/cm**3
  tempini:
    value: 1.0
    unit: K
