par:
  simulation:
    name: CosmologicalSodShock1D_LambdaCDM
    coordinate_system: cartesian
    initial_condition_filename: InitialCondition_lambda_cdm.hdf5
    final_time: {value: 0.4, unit: s}
  mesh: {grid_cells: 800, ghost_cells: 2}
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 1
    riemann_solver: HLLC
    flux_limiter: minmod
    dual_energy: false
  gravity:
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmological_gravity: false
    cosmology_type: lambda_cdm
    cosmology_t_ref: 1.0
    cosmology_a_ref: 1.0
    cosmology_omega_m: 0.3
    cosmology_omega_lambda: 0.7
    cosmology_hubble_ref: null
  boundary: {condition: Periodic}
  output:
    directory: outputs_lambda_cdm
    savedir: outputs_lambda_cdm
    filename_prefix: Output
    cadence: {value: 0.1, unit: s}
  units:
    CodeUnits:
      name: cosmological_sod_lambda_cdm_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  boxsize: {value: 8.0, unit: cm}
  time: {value: 0.0, unit: s}
  rho_left: 1.0
  rho_right: 0.125
  temp_left: {value: 1.0e-8, unit: K}
  temp_right: {value: 8.0e-9, unit: K}
  mu: 1.0
example: {}
