par:
  simulation:
    name: CosmologicalSodShock1D
    coordinate_system: cartesian
    final_time: {value: 0.4, unit: s}
  mesh:
    grid_cells: 800
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 1
    riemann_solver: HLLC
    flux_limiter: minmod
    dual_energy: false
  cosmology:
    cosmological: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: {value: 1.0, unit: s}
    cosmology_a_ref: 1.0
  gravity:
  boundary:
    condition: Periodic
  output:
    directory: .
    filename_prefix: Output
    cadence: {value: 0.1, unit: s}
  units:
    CodeUnits:
      name: cosmological_sod_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size_comoving: {value: 8.0, unit: cm}
  time_cosmic: {value: 0.0, unit: s}
  rho_left_proper: {value: 1.0, unit: g/cm**3}
  rho_right_proper: {value: 0.125, unit: g/cm**3}
  temperature_left_proper: {value: 1.0e-8, unit: K}
  temperature_right_proper: {value: 8.0e-9, unit: K}
  mu: 1.0
example: {}
