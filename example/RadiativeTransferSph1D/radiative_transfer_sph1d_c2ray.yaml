par:
  simulation:
    name: RadiativeTransferSph1D_C2Ray
    initial_condition_filename: InitialCondition_C2Ray.hdf5
    coordinate_system: spherical
    final_time: {value: 1000.0, unit: yr}
  mesh:
    grid_cells: 256
    ghost_cells: 2
  hydrodynamics:
    order: 0
  boundary:
    condition: OpenSph
  timestep:
    evolution_timestep: {value: 1000.0, unit: yr}
  output:
    directory: .
    savedir: .
    filename_prefix: Output_C2Ray
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 4.92e31
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  chemistry:
    hydrogen_mass_fraction: 1.0
  thermochemistry:
    hydrogen_chemistry: true
    thermochemistry_network: hydrogen
    hydrogen_recombination: true
    hydrogen_collisional_ionization: false
    hydrogen_thermal_coupling: false
    hydrogen_ngamma_initial: {value: 0.0, unit: 1/cm**3}
    hydrogen_sigma_gamma: {value: 1.0e-18, unit: cm**2}
  radiation:
    radiative_transfer: true
    radiative_transfer_method: long_characteristics
    radiative_transfer_temporal_scheme: c2ray
    radiative_transfer_c2ray_max_iterations: 32
    radiative_transfer_c2ray_tolerance: 1.0e-6
    radiative_transfer_c2ray_relaxation: 1.0
    radiative_transfer_c2ray_nonconvergence: raise
    radiative_transfer_boundary_flux: {value: 0.0, unit: 1/(cm**2*s)}
    radiative_transfer_source_photon_rate: {value: 1.0e49, unit: 1/s}
    radiative_transfer_direction: 1
initial_condition:
  boxsize: {value: 1.0, unit: pc}
example: {}
