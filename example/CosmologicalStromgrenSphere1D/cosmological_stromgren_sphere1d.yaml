par:
  simulation:
    name: CosmologicalStromgrenSphere1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 1.0, unit: s}
  mesh:
    grid_cells: 256
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.5
    order: 0
  boundary:
    condition: OpenSph
  timestep:
    dtmin: {value: 1.0e-6, unit: Myr}
    dtmax: {value: 50.0, unit: Myr}
    hydrogen_source_CFL: 10000.0
  output:
    directory: outputs
    filename_prefix: Output
    time_list_filename: output_times.txt
  cosmology:
    cosmological: true
    cosmological_expansion: true
    supercomoving_coordinates: true
    cosmology_type: einstein_de_sitter
    cosmology_t_ref: {value: 1.0, unit: s}
    cosmology_a_ref: 1.0
  gravity:
    selfgravity: false
    externalgravity: false
  chemistry:
    hydrogen_chemistry: true
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 1.0
    hydrogen_recombination: true
    hydrogen_collisional_ionization: true
    hydrogen_alpha_B: {value: 2.59e-13, unit: cm**3/s}
    hydrogen_beta: {value: 3.1e-16, unit: cm**3/s}
    hydrogen_update_mu: false
  thermochemistry:
    hydrogen_thermal_coupling: false
    hydrogen_source_solver: split_implicit
    hydrogen_split_implicit_max_subcycles: 1000
  radiation:
    radiative_transfer: true
    radiative_transfer_method: long_characteristics
    radiative_transfer_temporal_scheme: c2ray
    hydrogen_radiation_field: false
    hydrogen_radiation_evolution: false
    hydrogen_ngamma_initial: {value: 0.0, unit: 1/cm**3}
    hydrogen_sigma_gamma: {value: 8.13e-18, unit: cm**2}
    hydrogen_epsilon_gamma: {value: 0.0, unit: eV}
    hydrogen_photon_energy: {value: 13.6, unit: eV}
    radiative_transfer_boundary_flux: {value: 0.0, unit: 1/(cm**2*s)}
    source_photon_rate: {value: 5.0e48, unit: 1/s}
    radiative_transfer_direction: 1
    radiative_transfer_c2ray_nonconvergence: raise
  units:
    CodeUnits:
      name: cosmological_stromgren_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.98847e33
        UnitLength_in_cgs: 3.0856775814913673e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size_comoving: {value: 400.0, unit: kpc}
  time_cosmic: {value: 1.0, unit: s}
  temperature_proper: {value: 1.0e4, unit: K}
example:
  initial_scale_factor: 0.1
  final_scale_factor: 0.9
  hydrogen_mass_fraction_of_total_matter: 0.1
  hubble_constant: {value: 70.0, unit: km/(s*Mpc)}
  alpha_B: {value: 2.59e-13, unit: cm**3/s}
  beta: {value: 3.1e-16, unit: cm**3/s}
  source_photon_rate: {value: 5.0e48, unit: 1/s}
  temperature: {value: 1.0e4, unit: K}
