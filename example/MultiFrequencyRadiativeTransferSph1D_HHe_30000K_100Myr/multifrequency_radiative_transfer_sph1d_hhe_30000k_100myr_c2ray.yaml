par:
  simulation:
    name: MultiFrequencyRadiativeTransferSph1D_HHe_30000K_100Myr_C2Ray
    initial_condition_filename: InitialCondition_C2Ray.hdf5
    coordinate_system: spherical
    final_time:
      value: 100.0
      unit: Myr
  mesh:
    grid_cells: 128
    ghost_cells: 2
  boundary:
    condition: OpenSph
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.98841586e33
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  chemistry:
    hydrogen_helium_xHeIII_initial: 0.0
    hydrogen_helium_xHeI_initial: 1.0
    hydrogen_helium_xHeII_initial: 0.0
    hydrogen_mass_fraction: 0.75
    hydrogen_xHI_initial: 1.0
    hydrogen_recombination: true
    hydrogen_chemistry: true
    hydrogen_update_mu: true
    helium_mass_fraction: 0.25
    hydrogen_collisional_ionization: true
  thermochemistry:
    hydrogen_initial_collisional_equilibrium: true
    hydrogen_thermal_coupling: true
    relative_tolerance: 0.001
    absolute_tolerance: 1.0e-10
    thermochemistry_network: hydrogen_helium
    explicit_tolerance: 0.1
  radiation:
    radiative_transfer_c2ray_nonconvergence: raise
    radiation_spectrum_total_photon_rate:
      value: 5.0e48
      unit: 1/s
    radiative_transfer_temporal_scheme: c2ray
    radiative_transfer_direction: 1
    radiative_transfer: true
    radiation_spectrum_filename: ../../tools/radiation_spectrum_generator/radiation_spectrum_BB30000K_5groups_HHe.h5
    radiative_transfer_method: long_characteristics
initial_condition:
  number_of_cells: 128
  boxsize:
    value: 10.0
    unit: kpc
  hydrogen_number_density:
    value: 0.001
    unit: 1/cm**3
  initial_temperature:
    value: 100.0
    unit: K
example:
  outdir: .
  outfileprefix: Output_C2Ray
  savedir: .
  figure_filename: MultiFrequencyRadiativeTransferSph1D_HHe_30000K_100Myr_C2Ray_PIE.jpg
  stellar_spectrum_blackbody_temperature_K: 30000.0
  metal_pie_enabled: true
  metal_pie_table_filename: ../../../metal_pie_table/metal_pie_table_Z1_metals.h5
  metallicity: 1.0
  evolution_timestep:
    value: 0.5
    unit: Myr
  initial_temperature:
    value: 100.0
    unit: K
  hydrogen_number_density:
    value: 0.001
    unit: 1/cm**3
  boxsize:
    value: 10.0
    unit: kpc
