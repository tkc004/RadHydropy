par:
  simulation:
    name: BallisticInfallSphericalPointMass1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.0001, unit: Myr}
  mesh:
    grid_cells: 256
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.2
    order: 0
  boundary:
    condition: Reflecting
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 1.0e12, unit: s}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    time_list_filename: ballistic_infall_spherical_point_mass1d_output_times.txt
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 4.92e31
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 256
  coordinate_system: spherical
  box_size: {value: 20.0, unit: pc}
  current_time: {value: 0.0, unit: s}
  inner_radius: {value: 2.0, unit: pc}
  outer_radius: {value: 20.0, unit: pc}
  reference_density: {value: 1.0e-24, unit: g/cm**3}
  initial_temperature: {value: 1.0, unit: K}
  mean_molecular_weight: 1.0
  point_mass: {value: 1.0e38, unit: g}
example:
  plot_filename: BallisticInfallSphericalPointMass1D.jpg
