par:
  simulation:
    name: SedovTaylor1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: cartesian
    final_time: {value: 1.0, unit: s}
  mesh:
    ghost_cells: 2
    area: {value: 1.0, unit: cm**2}
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 0
  boundary:
    condition: Periodic
  timestep:
    dtmin: {value: 2.0e-8, unit: s}
    dtmax: {value: 2.0e-1, unit: s}
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    cadence: {value: 0.1, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 1001
  coordinate_system: cartesian
  box_size: {value: 2.0, unit: cm}
  current_time: {value: 0.0, unit: s}
  initial_density: {value: 1.0, unit: g/cm**3}
  explosion_energy: {value: 1.0, unit: erg}
  explosion_radius: {value: 0.2, unit: cm}
  mean_molecular_weight: 1.0
example:
  output_indices: [1, 2, 3, 4]
  plot_filename: SedovTaylor1D.jpg
