par:
  simulation:
    name: PassiveGasAngularMomentum1D
    initial_condition_filename: PassiveGasAngularMomentum1D_InitialCondition.hdf5
    coordinate_system: cartesian
    final_time: {value: 0.2, unit: s}
  mesh:
    grid_cells: 32
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.4
    CFL: 0.1
    order: 0
    gas_angular_momentum: true
  boundary:
    condition: Periodic
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 0.05, unit: s}
  output:
    directory: outputs
    savedir: outputs
    filename_prefix: Output
    cadence: {value: 0.1, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: passive_angular_momentum_cgs
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  box_size: {value: 1.0, unit: cm}
  current_time: {value: 0.0, unit: s}
  initial_density: {value: 1.0, unit: g/cm**3}
  velocity: {value: 0.1, unit: cm/s}
  temperature: {value: 1.0e-5, unit: K}
  mean_molecular_weight: 1.0
  angular_momentum_amplitude: {value: 0.2, unit: cm**2/s}
  angular_momentum_offset: {value: 0.5, unit: cm**2/s}
