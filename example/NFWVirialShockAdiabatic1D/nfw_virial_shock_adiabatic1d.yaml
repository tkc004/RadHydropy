par:
  simulation:
    name: NFWVirialShockAdiabatic1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time:
      value: 2000.0
      unit: Myr
  mesh:
    grid_cells: 512
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.2
    order: 0
  boundary:
    condition: OutflowSph
  timestep:
    dtmin:
      value: 1.0e3
      unit: yr
    dtmax:
      value: 2.0
      unit: Myr
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    time_list_filename: nfw_virial_shock_adiabatic1d_output_times.txt
  units:
    CodeUnits:
      name: galactic_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e12
        UnitLength_in_cgs: 3.08567758e21
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
  diagnostics:
    verbose: 0
