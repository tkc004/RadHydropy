runparams:
  simname: HydrogenPhotoheating1D
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: output_times.txt
  outdeltatime:
    value: 1.0e7
    unit: yr
  savedir: .
  coordsys: cartesian
  EOStype: polytropic
  gamma: 1.6666666666666667
  timesim:
    value: 1.0e8
    unit: yr
  area:
    value: 1.0
    unit: cm**2
  CFL: 0.5
  boundcond: Periodic
  vel_inflow:
    value: 0.0
    unit: cm/s
  rho_inflow:
    value: 1.0
    unit: mp/cm**3
  temp_inflow:
    value: 0.0
    unit: K
  mu_inflow: 1.0
  vel_outflow:
    value: 0.0
    unit: cm/s
  rho_outflow:
    value: 1.0
    unit: mp/cm**3
  temp_outflow:
    value: 0.0
    unit: K
  mu_outflow: 1.0
  noghost: 2
  verbose: 0
  order: 0
  dtmin:
    value: 1.0e-9
    unit: yr
  dtmax:
    value: 1.0e6
    unit: yr
  photon_flux:
    value: 1.0e12
    unit: 1/(cm**2*s)
  source_switch_time:
    value: 5.0e7
    unit: yr
  excess_photoionization_energy:
    value: 6.33
    unit: eV
  sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  thermal_equilibrium_timescale:
    value: 1.99526231496888e9
    unit: yr
  hydrogen_chemistry: true
  hydrogen_mass_fraction: 1.0
  hydrogen_xHI_initial: 1.0
  hydrogen_xHI_inflow: 1.0
  hydrogen_xHI_outflow: 1.0
  hydrogen_source_CFL: 0.1
  hydrogen_update_mu: true
  hydrogen_thermal_coupling: true
  hydrogen_recombination: true
  hydrogen_collisional_ionization: true
  hydrogen_radiation_field: true
  hydrogen_radiation_evolution: false
  hydrogen_ngamma_initial:
    value: 0.0
    unit: 1/cm**3
  hydrogen_ngamma_inflow:
    value: 0.0
    unit: 1/cm**3
  hydrogen_ngamma_outflow:
    value: 0.0
    unit: 1/cm**3
  hydrogen_sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  hydrogen_epsilon_gamma:
    value: 6.33
    unit: eV
  CodeUnits:
    name: cgs_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 1.0
      UnitLength_in_cgs: 1.0
      UnitVelocity_in_cgs: 1.0
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 16
  coordsys: cartesian
  boxsize:
    value: 1.0
    unit: kpc
  time:
    value: 0.0
    unit: yr
  nHini:
    value: 1.0
    unit: 1/cm**3
  tempini:
    value: 100.0
    unit: K
  xHIini: 1.0
  ngammaini:
    value: 1.0
    unit: 1/cm**3
  muini: 1.0
