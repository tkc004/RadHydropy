par:
  simulation:
    name: HydrogenPhotoheating1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: cartesian
    final_time:
      value: 1.0e8
      unit: yr
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    CFL: 0.5
    order: 0
  boundary:
    condition: Periodic
    inflow_velocity: {value: 0.0, unit: cm/s}
    inflow_density: {value: 1.0, unit: mp/cm**3}
    inflow_temperature: {value: 0.0, unit: K}
    inflow_mu: 1.0
    outflow_velocity: {value: 0.0, unit: cm/s}
    outflow_density: {value: 1.0, unit: mp/cm**3}
    outflow_temperature: {value: 0.0, unit: K}
    outflow_mu: 1.0
  timestep:
    dtmin: {value: 1.0e-9, unit: yr}
    dtmax: {value: 1.0e6, unit: yr}
    hydrogen_source_CFL: 0.1
  output:
    directory: .
    savedir: .
    filename_prefix: Output
    time_list_filename: output_times.txt
    cadence: {value: 1.0e7, unit: yr}
  diagnostics:
    verbose: 0
  chemistry:
    hydrogen_mass_fraction: 1.0
    hydrogen_xHI_initial: 1.0
    hydrogen_xHI_inflow: 1.0
    hydrogen_xHI_outflow: 1.0
  thermochemistry:
    hydrogen_chemistry: true
    hydrogen_update_mu: true
    hydrogen_thermal_coupling: true
    hydrogen_recombination: true
    hydrogen_collisional_ionization: true
  radiation:
    hydrogen_radiation_field: true
    hydrogen_radiation_evolution: false
    hydrogen_ngamma_initial: {value: 0.0, unit: 1/cm**3}
    hydrogen_ngamma_inflow: {value: 0.0, unit: 1/cm**3}
    hydrogen_ngamma_outflow: {value: 0.0, unit: 1/cm**3}
    hydrogen_sigma_gamma: {value: 6.3e-18, unit: cm**2}
    hydrogen_epsilon_gamma: {value: 6.33, unit: eV}
  units:
    CodeUnits:
      name: cgs_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0

initial_condition:
  grid_cells: 16
  coordinate_system: cartesian
  box_size:
    value: 1.0
    unit: kpc
  current_time:
    value: 0.0
    unit: yr
  hydrogen_number_density:
    value: 1.0
    unit: 1/cm**3
  temperature:
    value: 100.0
    unit: K
  neutral_fraction: 1.0
  photon_number_density:
    value: 1.0
    unit: 1/cm**3
  mean_molecular_weight: 1.0

example:
  photon_flux:
    value: 1.0e12
    unit: 1/(cm**2*s)
  source_switch_time:
    value: 5.0e7
    unit: yr
  excess_photoionization_energy:
    value: 6.33
    unit: eV
  sigma_gamma:
    value: 6.3e-18
    unit: cm**2
  thermal_equilibrium_timescale:
    value: 1.99526231496888e9
    unit: yr
  plot_filename: HydrogenPhotoheating1D.jpg
