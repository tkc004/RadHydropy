runparams:
  simname: HydrostaticEquilibrium1d
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  outputtimefilename: hydrostatic_equilibrium1d_output_times.txt
  savedir: .
  CodeUnits:
    name: galactic_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 4.92e31
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0
  coordsys: cartesian
  EOStype: isothermal
  gamma: 1.0
  timesim:
    value: 0.0001
    unit: Myr
  CFL: 0.2
  dtmin:
    value: 1.0e-10
    unit: s
  dtmax:
    value: 1.0e12
    unit: s
  boundcond: Reflecting
  verbose: 0
  order: 0
  noghost: 2

ICparams:
  nogrid: 256
  coordsys: cartesian
  boxsize:
    value: 10.0
    unit: pc
  time:
    value: 0.0
    unit: s
  rho_ref:
    value: 1.0e-24
    unit: g/cm**3
  tempini:
    value: 1.0e4
    unit: K
  muini: 1.0
  gravity_strength:
    value: 1.0e-7
    unit: cm/s**2
