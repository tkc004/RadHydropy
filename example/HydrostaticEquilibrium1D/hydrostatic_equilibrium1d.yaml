runparams:
  simname: HydrostaticEquilibrium1d
  ICfilename: InitialCondition.hdf5
  outdir: .
  outfileprefix: Output
  savedir: .
  coordsys: cartesian
  EOStype: isothermal
  gamma: 1.0
  timesim:
    value: 0.05
    unit: Myr
  outdeltatime:
    value: 0.05
    unit: Myr
  CFL: 0.2
  boundcond: Open
  verbose: 0
  order: 0
  noghost: 2

ICparams:
  nogrid: 256
  coordsys: cartesian
  boxsize:
    value: 10.0
    unit: pc
  time:
    value: 0.0
    unit: s
  rho_ref:
    value: 1.0e-24
    unit: g/cm**3
  tempini:
    value: 1.0e4
    unit: K
  muini: 1.0
  gravity_strength:
    value: 1.0e-7
    unit: cm/s**2
