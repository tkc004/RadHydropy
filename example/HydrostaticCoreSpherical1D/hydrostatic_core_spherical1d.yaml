runparams:
  simname: HydrostaticCoreSpherical1D
  ICfilename: outputs/InitialCondition.hdf5
  outdir: outputs
  savedir: outputs
  outfileprefix: Output
  coordsys: spherical
  EOStype: isothermal
  gamma: 1.6666666666666667
  externalgravity: true
  selfgravity: false
  boundcond: Reflecting
  order: 0
  noghost: 2
  CFL: 0.20
  dtmin: {value: 1.0e-10, unit: s}
  dtmax: {value: 1.0e12, unit: s}
  timesim: {value: 1.0, unit: s}
  outputtimefilename: hydrostatic_core_spherical1d_output_times.txt
  gas_core_model: hydrostatic_fixed
  gas_core_radius: {value: 5.0, unit: pc}
  CodeUnits:
    name: hydrostatic_core_spherical_unit_system
    InternalUnitSystem:
      UnitMass_in_cgs: 4.92e31
      UnitLength_in_cgs: 3.08567758e21
      UnitVelocity_in_cgs: 1.0e5
      UnitCurrent_in_cgs: 1.0
      UnitTemp_in_cgs: 1.0

ICparams:
  nogrid: 256
  rmin: {value: 2.0, unit: pc}
  rmax: {value: 20.0, unit: pc}
  rho_ref: {value: 1.0e-24, unit: g/cm**3}
  temperature: {value: 1.0e4, unit: K}
  mu: 1.0
  point_mass: {value: 1.0e38, unit: g}
