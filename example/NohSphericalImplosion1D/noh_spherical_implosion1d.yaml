par:
  simulation:
    name: NohSphericalImplosion1D
    initial_condition_filename: InitialCondition.hdf5
    coordinate_system: spherical
    final_time: {value: 0.30, unit: s}
  mesh:
    ghost_cells: 2
  hydrodynamics:
    eos_type: polytropic
    gamma: 1.6666666666666667
    order: 0
    riemann_solver: Rusanov
    dual_energy: true
    positivity_preserving: true
    temperature_jump_error_threshold:
  boundary:
    condition: InflowSph
    rho_inflow_proper: {value: 1.0, unit: g/cm**3}
    vel_inflow_proper: {value: -1.0, unit: cm/s}
    temperature_inflow_proper: {value: 1.0e-12, unit: K}
    inflow_mu: 1.0
  timestep:
    dtmin: {value: 1.0e-8, unit: s}
    dtmax: {value: 2.0e-3, unit: s}
  output:
    directory: outputs_noh_spherical_implosion1d
    savedir: outputs_noh_spherical_implosion1d
    filename_prefix: Output
    cadence: {value: 0.05, unit: s}
  diagnostics:
    verbose: 0
  units:
    CodeUnits:
      name: noh_spherical_implosion_cgs
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0
        UnitLength_in_cgs: 1.0
        UnitVelocity_in_cgs: 1.0
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  grid_cells: 256
  coordinate_system: spherical
  box_size_proper: {value: 1.0, unit: cm}
  time_proper: {value: 0.0, unit: s}
  rho_proper: {value: 1.0, unit: g/cm**3}
  vel_proper: {value: -1.0, unit: cm/s}
  temperature_proper: {value: 1.0e-12, unit: K}
  mean_molecular_weight: 1.0
example:
  resolutions: [128, 256, 512]
  plot_filename: NohSphericalImplosion1D_Profiles.jpg
