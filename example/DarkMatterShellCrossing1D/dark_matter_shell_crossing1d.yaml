par:
  simulation:
    name: DarkMatterShellCrossing1D
    final_time: {value: 0.6, unit: pc/(km/s)}
  output:
    directory: .
  timestep:
    output_interval: {value: 0.002, unit: pc/(km/s)}
    crossing_safety_factor: 0.1
  units:
    CodeUnits:
      name: dark_matter_shell_unit_system
      InternalUnitSystem:
        UnitMass_in_cgs: 1.0e33
        UnitLength_in_cgs: 3.08567758e18
        UnitVelocity_in_cgs: 1.0e5
        UnitCurrent_in_cgs: 1.0
        UnitTemp_in_cgs: 1.0
initial_condition:
  number_of_shells: 32
  radius_inner_dimensionless: 0.08
  radius_outer_dimensionless: 0.8
  total_mass_dimensionless: 1.0
  velocity_scale_dimensionless: -0.55
  angular_momentum_fraction: 0.15
  softening_dimensionless: 0.02
example: {}
