[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radhydropy"
version = "1.0.0"
description = "Python code to simulate 1D hydrodynamics."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Tsang Keung Chan", email = "chantsangkeung@gmail.com"},
]
dependencies = [
    "h5py",
    "numpy",
    "PyYAML",
    "unyt",
]

[project.optional-dependencies]
test = [
    "pytest",
]
quality = [
    "mypy>=1.10",
    "ruff>=0.6",
]
docs = [
    "matplotlib",
    "sphinx>=7",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "docs/_build",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",
    "D",
    "TRY",
    "EM",
    "PT",
    "ANN",
    "E402",
    "N806",
    "PLR0913",
    "PLR0917",
    "ARG001",
    "ARG002",
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.pylint]
max-statements = 150

[tool.mypy]
python_version = "3.10"
files = [
    "radhydropy/runtime_fields.py",
    "radhydropy/diagnostic_logging.py",
    "radhydropy/io/__init__.py",
    "radhydropy/io/scheduling.py",
]
check_untyped_defs = true
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
show_error_codes = true
