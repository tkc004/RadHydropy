[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radhydropy"
version = "1.0.0"
description = "Python code to simulate 1D hydrodynamics."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Tsang Keung Chan", email = "chantsangkeung@gmail.com"},
]
dependencies = [
    "h5py",
    "numpy",
    "PyYAML",
    "unyt",
]

[project.optional-dependencies]
test = [
    "pytest",
]
quality = [
    "mypy>=1.10",
    "ruff>=0.6",
]
docs = [
    "matplotlib",
    "sphinx>=7",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "docs/_build",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",
    "D",
    "TRY",
    "EM",
    "PT",
    "ANN",
    "E402",
    "N806",
    "N803",
    "N812",
    "N815",
    "N816",
    "RUF100",
    "PLR0913",
    "PLR0917",
    "PLW0603",
    "ARG001",
    "ARG002",
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.pylint]
max-statements = 150

[tool.mypy]
python_version = "3.10"
files = [
    "radhydropy/runtime_fields.py",
    "radhydropy/diagnostic_logging.py",
    "radhydropy/io/__init__.py",
    "radhydropy/io/scheduling.py",
    "radhydropy/io/cosmology_state.py",
    "radhydropy/io/fields.py",
    "radhydropy/cosmology/context.py",
    "radhydropy/arrays.py",
    "radhydropy/cosmology/state.py",
    "radhydropy/cosmology/variables.py",
    "radhydropy/field_metadata.py",
    "radhydropy/solver/positivity.py",
    "radhydropy/chemistry.py",
    "radhydropy/io/cosmology.py",
    "radhydropy/chemistry_species/hydrogen.py",
    "radhydropy/solver/hydrostatic.py",
    "radhydropy/thermo_networks/cie/cie_tables.py",
    "radhydropy/rsim/evolution.py",
    "radhydropy/rsim/sources.py",
    "radhydropy/io/validation.py",
    "radhydropy/output.py",
    "radhydropy/radiation_spectrum.py",
    "radhydropy/example_config.py",
    "radhydropy/solver/dual_energy.py",
    "radhydropy/diagnostics.py",
    "radhydropy/solver/timestep.py",
    "radhydropy/solver/gravity_sources.py",
    "radhydropy/solver/boundary_conditions.py",
    "radhydropy/solver/fluxes.py",
    "radhydropy/eos.py",
    "radhydropy/solver/angular_momentum.py",
    "radhydropy/thermo_networks/base.py",
    "radhydropy/thermo_networks/pie/metal_pie_table.py",
    "tools/read_cooling_table.py",
    "tools/make_chianti_cie_ion_fraction_table.py",
    "tools/read_chianti_cie_ion_fraction.py",
    "tools/radiation_spectrum_generator/generate_radiation_spectrum.py",
    "tools/plot_hm12_pie_rates.py",
    "tools/make_chianti_cooling_table.py",
    "tools/lcdm_correlation.py",
]
check_untyped_defs = true
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
show_error_codes = true
