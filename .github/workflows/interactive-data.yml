name: Refresh interactive data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/interactive-data.yml"
      - "example/CosmologicalVirialShock1D/**"
      - "example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/**"
      - "tools/export_interactive_cosmology.py"
      - "tools/export_stellar_wind_interactive.py"
      - "tools/lcdm_correlation.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: interactive-data
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Generate cosmological interactive data
        run: |
          python -c "from tools.lcdm_correlation import generate_lcdm_correlation_table; generate_lcdm_correlation_table('example/CosmologicalVirialShock1D/outputs_correlation/eds_finite_box_1Mpc_linear_correlation.h5')"
          python example/CosmologicalVirialShock1D/cosmological_gas_correlation_z100.py \
            --config example/CosmologicalVirialShock1D/cosmological_gas_correlation_tvir1e3_z15.yaml
          python tools/export_interactive_cosmology.py

      - name: Generate stellar-wind interactive data
        run: |
          python example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/dynamic_stromgren_sphere_photoheating20pc_stellar_wind1d.py \
            --config example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/dynamic_stromgren_sphere_photoheating20pc_stellar_wind1d.yaml
          python tools/export_stellar_wind_interactive.py

      - name: Upload interactive data artifact
        uses: actions/upload-artifact@v4
        with:
          name: interactive-data-${{ github.sha }}
          path: docs/_static/interactive/*-data.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
