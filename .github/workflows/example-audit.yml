name: Example contract audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Audit all example contracts
        run: python -m pytest -q tests/test_example_alignment.py

      - name: Run the documented Sod shock smoke test
        working-directory: example/SodShock1D
        run: python sodshock1d.py

      - name: Verify smoke-test artifacts
        working-directory: example/SodShock1D
        run: |
          test -s InitialCondition.hdf5
          test -s Output_002.hdf5
          test -s SodShock1D.jpg
