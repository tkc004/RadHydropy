name: Static quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and quality dependencies
        run: python -m pip install -e ".[test,quality]"

      - name: Run Ruff checks
        run: ruff check radhydropy tests

      - name: Run mypy boundary checks
        run: mypy
