name: Documentation build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Generate interactive cosmology data
        run: |
          python -c "from tools.lcdm_correlation import generate_lcdm_correlation_table; generate_lcdm_correlation_table('example/CosmologicalVirialShock1D/outputs_correlation/eds_finite_box_1Mpc_linear_correlation.h5')"
          python example/CosmologicalVirialShock1D/cosmological_gas_correlation_z100.py \
            --config example/CosmologicalVirialShock1D/cosmological_gas_correlation_tvir1e3_z15.yaml
          python tools/export_interactive_cosmology.py

      - name: Generate interactive stellar-wind data
        run: |
          python example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/dynamic_stromgren_sphere_photoheating20pc_stellar_wind1d.py \
            --config example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/dynamic_stromgren_sphere_photoheating20pc_stellar_wind1d.yaml
          python tools/export_stellar_wind_interactive.py

      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Check documentation links
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
