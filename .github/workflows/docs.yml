name: Documentation build

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/interactive-data.yml"
      - "example/CosmologicalVirialShock1D/**"
      - "example/DynamicStromgrenSpherePhotoheating20pcStellarWind1D/**"
      - "tools/export_interactive_cosmology.py"
      - "tools/export_stellar_wind_interactive.py"
      - "tools/lcdm_correlation.py"
      - "pyproject.toml"
  pull_request:
  workflow_run:
    workflows: ["Refresh interactive data"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  sphinx:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Find latest interactive-data run
        id: interactive-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --workflow interactive-data.yml --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0]')"
          run_id="$(jq -r '.databaseId // empty' <<< "$run")"
          head_sha="$(jq -r '.headSha // empty' <<< "$run")"
          if [ -z "$run_id" ] || [ -z "$head_sha" ]; then
            echo "No successful interactive-data workflow run was found." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=interactive-data-$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download interactive data
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.interactive-data.outputs.artifact_name }}
          path: docs/_static/interactive
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.interactive-data.outputs.run_id }}

      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Check documentation links
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
