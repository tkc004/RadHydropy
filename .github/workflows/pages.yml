name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Generate interactive cosmology data
        run: |
          python -c "from tools.lcdm_correlation import generate_lcdm_correlation_table; generate_lcdm_correlation_table('example/CosmologicalVirialShock1D/outputs_correlation/eds_finite_box_1Mpc_linear_correlation.h5')"
          python example/CosmologicalVirialShock1D/cosmological_gas_correlation_z100.py \
            --config example/CosmologicalVirialShock1D/cosmological_gas_correlation_tvir1e3_z15.yaml
          python tools/export_interactive_cosmology.py

      - name: Build Sphinx docs
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
